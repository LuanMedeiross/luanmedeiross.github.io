# Como construir um scraper que sobrevive ao mundo real

## Parte 1 · Como pensar um scraper

*Como decidir tudo antes de escrever a primeira linha de código.*

Existe um abismo entre "extrair dados de uma página" e "ter uma automação que coleta de um site que não quer ser automatizado, todos os dias, por meses". Quase todo tutorial te ensina o primeiro: faz um GET, joga o HTML num parser, pega o campo. Aqui a gente fala do segundo, e ele começa bem antes do código.

Se você guardar uma frase só deste capítulo, que seja esta: a primeira ferramenta de um scraper é o DevTools do navegador. O editor de código vem bem depois. As decisões que definem se o seu projeto vai ser uma tarde tranquila ou uma semana no escuro já estão tomadas antes de você abrir esse editor.

Aqui não tem código de scraper nenhum, e isso é de propósito. A ideia é construir o raciocínio: o que olhar, o que decidir, o que evitar.

## O erro número um

Quem está começando abre o editor e escreve código contra o site que está vendo: o HTML renderizado, bonitinho, na tela do navegador. Esse é o erro número um, e sai caro, porque o que aparece na tela quase nunca é o que chega pela rede.

O navegador é um mentiroso conveniente. Ele baixa um HTML, executa JavaScript, faz mais dez requisições por baixo dos panos, monta a página e te entrega o resultado pronto. Quando você dá "inspecionar elemento", está olhando o produto final, não a matéria-prima que o servidor mandou. Quem escreve um scraper em cima disso passa horas tentando entender por que o seu cliente HTTP recebe um HTML vazio enquanto o navegador mostra a tabela cheia.

A regra que evita isso é simples e não tem exceção: mapeie o site antes de codar. Cinco minutos lendo as requisições economizam cinco horas de código no escuro.

## A decisão que define o projeto inteiro

Antes de qualquer linha, você responde uma pergunta. A resposta dela decide a ferramenta que você vai usar e o tamanho da dor de cabeça que vem junto.

> O conteúdo vem pronto numa requisição, ou é injetado no HTML por JavaScript?

De um lado, um scraper de 30 linhas com um cliente HTTP. Do outro, um projeto cheio de navegador e espera de renderização. E você não chega nessa resposta no chute: abre o DevTools e olha.

### O procedimento, passo a passo

1. Abra o **DevTools** (F12), vá na aba **Network**, filtre por **Fetch/XHR** e marque **Preserve log** (assim você não perde nada num redirect).
2. **Faça a busca à mão**, no navegador mesmo: preencha o formulário, clique em buscar, navegue até o dado aparecer na tela.
3. Olhe o que rolou na aba Network. Você vai cair num de três cenários:

   - **Apareceu uma requisição (XHR/Fetch) cuja resposta já traz os dados em JSON.** O site é movido a API, e esse é o melhor cenário possível. Você vai direto na API com um cliente HTTP simples, recebe JSON limpo e pula a renderização inteira. De quebra, JSON muda menos que HTML, então seu scraper fica mais estável.
   - **Não tem nenhuma XHR com os dados, mas o conteúdo já está no próprio documento HTML** (a requisição do tipo *document*, na aba Response, já contém a tabela). O site renderiza no servidor. O caminho é um cliente HTTP pra baixar o HTML e uma biblioteca de parsing pra extrair os campos.
   - **O dado só existe no DOM renderizado.** Você vê em *Elements*, mas ele não está nem no *document* nem em nenhuma XHR de dados, porque foi montado por JavaScript a partir de pedaços. Aqui, e só aqui, um navegador automatizado se justifica.

4. **Confirme antes de escrever código.** Achou a requisição que traz o dado? Botão direito, **Copy as cURL**, cola no terminal e roda. Se ela devolver os dados fora do navegador, o caminho HTTP está provado: você ainda não escreveu uma linha e já sabe que vai funcionar. Se ela só funciona dentro do navegador, porque depende de algo que o JavaScript gera na hora, você também tem a resposta, e vai precisar de um navegador.

Enquanto faz isso, anote os sinais que vão importar depois: que cookies e tokens o site seta, quais cabeçalhos ele exige (`Referer`, algum `X-CSRF-Token`), se aparece captcha no fluxo, os status codes, os redirects. Esse rabisco é o projeto inteiro num guardanapo.

### A regra de ouro

Você não escolhe a ferramenta por gosto nem por hábito. O alvo escolhe por você, e a aba Network te conta a escolha. O navegador é mais lento, mais frágil e mais fácil de detectar que um cliente HTTP, então ele entra só quando os outros dois cenários não dão conta.

## As seis fases de construir um scraper

O que vimos até aqui, reconhecer e decidir a abordagem, é o coração das duas primeiras fases. Mas o raciocínio completo, do primeiro contato até a automação rodando em produção, tem seis. Todas com a mesma estrutura: o que verificar, o que fazer, o que não fazer.

### Fase 1 · Reconhecimento

**Pergunta central:** "o que é esse site, e por onde o dado entra e sai?"

- **O que verificar:** a decisão-mãe (API ou HTML por JS) já saiu do passo anterior. Falta o resto do mapa: a entrada e a saída desejada, se há login, sessão ou token de estado no fluxo, se há captcha e de que tipo, se há paginação, e o volume esperado.
- **O que fazer:** anotar tudo isso na mesma passada em que você lê a rede. É barato agora e caro depois.
- **O que NÃO fazer:** confiar no primeiro palpite sobre as defesas, porque tem uma armadilha logo abaixo.

E a armadilha é essa: uma defesa pode estar no código, mas desligada. Já vi o reconhecimento acusar um captcha que estava desativado, com um `if (false)` em volta da função que deveria dispará-lo, enquanto o captcha de verdade era outro. Ter o `<script>` de um captcha carregado não quer dizer que ele está ativo. Confirme qual defesa dispara de fato olhando o que acontece quando você clica em buscar.

### Fase 2 · Escolha da abordagem

**Pergunta central:** "qual é a ferramenta mais barata que resolve isto?"

A decisão-mãe já te diz se o caminho base é HTTP ou navegador. O captcha é a segunda variável, e ela pode virar o jogo:

- Captcha de imagem, ou um token que vira parâmetro: o caminho HTTP ainda serve. Você resolve o captcha com um serviço externo e injeta o token na requisição.
- Captcha invisível que te dá uma nota por comportamento, ou desafio de página inteira: aí o navegador passa a ser necessário.

Tem um caso traiçoeiro que vale uma história. Quando o botão de buscar não faz um POST simples, mas dispara uma função JavaScript que usa um id de componente gerado automaticamente, o navegador costuma ganhar. Uma vez fiquei preso num alvo que devolvia "zero resultados" com o captcha resolvido e válido. Eu jurava que era o captcha. Não era. O submit da busca vinha de uma função JavaScript que mandava um id de componente tipo `comp_8f3a2`, gerado pelo próprio framework da página, e eu, pelo caminho HTTP, mandava o id errado, o `name` do botão visível. O servidor recebia, não reconhecia e respondia educadamente com zero resultados. No navegador, você chama a função da própria página e o id certo se resolve sozinho. Fica a lição: "zero resultados com tudo aparentemente certo" muitas vezes é um id de submit errado, não a sua busca.

- **O que NÃO fazer:** re-decidir a abordagem queimando tentativas no escuro. O Copy as cURL existe justamente pra provar o caminho antes de você apostar nele.

### Fase 3 · Reproduzir o fluxo

**Pergunta central:** "eu consigo extrair UM resultado, na mão, de forma confiável?"

- **O que verificar:** qual é a requisição exata que devolve o dado (método, cabeçalhos, corpo, cookies, token de estado), e se ela funciona isolada, fora do navegador.
- **O que fazer:** reproduzir essa única requisição e tirar um resultado antes de pensar em loop, threads ou volume. Se o alvo tem captcha, é a hora de gastar uma resolução só pra alcançar a página de resultado de verdade e ver o HTML que você vai parsear.
- **O que NÃO fazer:** automatizar em escala uma coisa que você ainda não fez funcionar uma vez. Loop em cima de uma requisição que você não entende só multiplica o erro.

### Fase 4 · Extração

**Pergunta central:** "como pego esse campo de um jeito que não quebre amanhã?"

Aqui vale a lei mais importante de todas: veja o HTML real antes de escrever o parser, sempre. E o corolário que custa caro: mesma plataforma não é o mesmo DOM.

Aprendi isso apanhando. Tinha dois sites rodando exatamente a mesma plataforma, e reaproveitei o parser do primeiro no segundo, afinal "é a mesma coisa". Não era. Num deles, um subcampo vinha aninhado dentro da linha; no outro, vinha numa linha separada. O parser copiado trazia o campo errado, sem reclamar. A lição: nunca reúse um parser por suposição, só depois de comparar o HTML real dos dois.

- **O que verificar:** onde o dado está na estrutura, o que é obrigatório e o que é opcional, e se os identificadores são estáveis ou gerados automaticamente.
- **O que fazer:** ancorar em coisas estáveis, nunca no que o site troca a cada deploy, e tolerar campo ausente em vez de explodir.
- **O que NÃO fazer:** prender um seletor num id gerado automaticamente, ou deixar um registro malformado no meio do lote derrubar todos os outros.

### Fase 5 · Escala e robustez

**Pergunta central:** "o que acontece quando eu faço isto mil vezes?"

- **O que verificar:** se o alvo aguenta concorrência, se bloqueia por IP, se tem limite de taxa.
- **O que fazer:** subir a concorrência aos poucos, usando ela como sonda. Muitos bloqueios (limite de taxa, WAF) só aparecem sob carga, e é melhor que apareçam no seu teste do que em produção. Ter retry com espera crescente, e um disjuntor que aborta o lote quando tudo começa a falhar, em vez de queimar a fila inteira contra um site que já caiu.
- **O que NÃO fazer:** disparar cinquenta threads de cara, ou insistir cegamente contra um bloqueio que claramente não vai ceder.

### Fase 6 · Manutenção

**Pergunta central:** "como vou saber, amanhã, que isto parou de funcionar?"

Essa é a fase que separa um script de um sistema, e a mais ignorada. Um scraper raramente morre com um erro limpo. Ele falha calado: o site muda, o seu parser passa a achar nada, e a base vai enchendo de registro vazio sem nenhum aviso. Você só descobre muito tempo depois.

- **O que verificar:** se o site mudou de estrutura, e se o parser ainda extrai o que deveria.
- **O que fazer:** ter um alarme de quebra. A falha de um scraper é silenciosa por natureza, e o trabalho é torná-la barulhenta.
- **O que NÃO fazer:** confiar que "rodou ontem, então roda hoje".

## O resumo de bolso

Antes de escrever a primeira linha de um scraper:

1. **Abra o DevTools, não o editor.** Faça a busca à mão e leia a rede.
2. **Responda a pergunta-mãe:** API ou HTML injetado por JS? Ela escolhe sua ferramenta.
3. **Prove o caminho** com um Copy as cURL antes de codar.
4. **Veja o HTML real** antes de qualquer parser. Mesma plataforma não é o mesmo DOM.
5. **Faça um funcionar** antes de fazer mil.
6. **Planeje o alarme de quebra** desde já, porque ele vai quebrar, e calado.

## Parte 2 · O ferramental

*As quatro peças que montam qualquer scraper — e a decisão de quando usar cada uma.*

No capítulo anterior a gente decidiu o caminho sem tocar em ferramenta nenhuma. Agora vamos dar nome às peças. São basicamente quatro, e a boa notícia é que você quase nunca usa todas ao mesmo tempo — você escolhe conforme a decisão que já tomou. Os exemplos de código a seguir são ilustrativos; o raciocínio vale em qualquer linguagem.

### O cliente HTTP

**O que é:** a peça que conversa HTTP direto com o servidor — manda uma requisição, recebe a resposta (HTML ou JSON) — sem abrir navegador nenhum. É a ferramenta mais leve e mais rápida da caixa, e resolve a maioria dos casos: tudo que é API ou HTML renderizado no servidor.

```python
import requests

r = requests.get("https://exemplo.com/busca", params={"q": "termo"})
print(r.status_code)          # 200?
dados = r.json()              # se a resposta for de uma API
# html = r.text               # ou o HTML cru, se for pra parsear
```

**Quando entra:** nos dois primeiros cenários do capítulo anterior (API, ou HTML vindo do servidor). É o seu padrão — comece sempre por aqui.

**A pegadinha:** o cliente HTTP padrão tem uma "assinatura" reconhecível, e alguns sites barram exatamente isso antes de te entregar qualquer coisa. "O cliente HTTP não passou" nem sempre quer dizer "preciso de navegador" — muitas vezes é só a assinatura. Como contornar isso é o assunto do próximo capítulo.

### A biblioteca de parsing de HTML

**O que é:** quando a resposta vem em HTML (e não em JSON), você precisa de algo que transforme aquele texto bruto numa árvore navegável, pra pescar cada campo por seletor — uma tag, uma classe, um id, ou o texto de um rótulo ao lado. É o que uma biblioteca de parsing faz.

```python
from bs4 import BeautifulSoup

soup = BeautifulSoup(html, "html.parser")
titulo = soup.select_one("h1.titulo").get_text(strip=True)
linhas = soup.select("table#resultados tr")
```

**Quando entra:** depois de baixar HTML do servidor. Se o caminho foi a API, você nem precisa dela — o JSON já chega estruturado.

**A pegadinha:** o jeito como você escreve o seletor decide se o parser sobrevive ao próximo deploy do site. Ancorar no lugar errado é a causa nº 1 de scraper que quebra em silêncio — tem um capítulo inteiro sobre isso mais à frente.

### O navegador automatizado

**O que é:** um navegador de verdade, dirigido por código. Ele carrega a página, executa o JavaScript, clica, preenche, espera o conteúdo aparecer — tudo que o cliente HTTP não faz. O preço: é ordens de magnitude mais lento e mais pesado, e mais fácil de detectar.

```python
from playwright.sync_api import sync_playwright

with sync_playwright() as p:
    browser = p.chromium.launch(headless=True)
    page = browser.new_page()
    page.goto("https://exemplo.com")
    page.fill("#busca", "termo")
    page.click("#enviar")
    page.wait_for_selector("#resultados tr")   # espera o CONTEÚDO, não só a resposta
    html = page.content()
```

**Quando entra:** no terceiro cenário do capítulo anterior — conteúdo montado só por JavaScript, desafios de página inteira, ou um captcha invisível que reprova ambiente sem tela. É o último recurso, nunca o primeiro.

**A pegadinha:** "esperar a resposta da rede" não é a mesma coisa que "esperar o conteúdo aparecer". Espere o elemento que você quer existir no DOM — senão você lê uma página ainda vazia e jura que o site mudou.

### O serviço de resolução de captcha

**O que é:** quando há um captcha no caminho e não dá pra desviar, você terceiriza a resolução para um serviço externo: manda os parâmetros do desafio, ele devolve um token válido, e você injeta esse token na requisição (ou no campo da página) pra seguir em frente.

```python
# serviço externo de resolução (há vários: 2Captcha, NopeCHA, etc.)
from twocaptcha import TwoCaptcha

solver = TwoCaptcha("SUA_API_KEY")
resultado = solver.turnstile(sitekey="0x4AAA...", url="https://exemplo.com")
token = resultado["code"]          # injeta no campo/parâmetro que o site espera
```

**Quando entra:** só quando o captcha está no caminho crítico e você já procurou — e não achou — um fluxo sem ele. Resolver custa dinheiro e segundos; é a última coisa que você adiciona, não a primeira.

**A pegadinha:** resolver o captcha não conserta uma sessão que o servidor já achou suspeita. Se você está recebendo captcha porque a sua conexão parece de robô, o token resolvido só adia o bloqueio — o problema está uma camada antes, e é o tema do próximo capítulo.

### Juntando as peças

Quatro peças. O **cliente HTTP** é o seu chão. A **biblioteca de parsing** vira HTML em dados. O **navegador** é o reforço caro, pra quando há JavaScript de verdade no caminho. E o **serviço de captcha** é o especialista que você chama por último. A arte não é dominar cada uma isoladamente — é escolher a **combinação mínima** que resolve o alvo, e nada além disso.

Com a caixa de ferramentas na mesa, o próximo capítulo encara o primeiro muro de verdade: fazer o servidor te aceitar como um cliente legítimo, da camada de TLS até o formulário de busca.

## Parte 3 · Conexão & Sessão

*O muro antes do conteúdo: fazer o servidor te aceitar como um cliente legítimo.*

Lá no Capítulo 1, a pegadinha do cliente HTTP foi: às vezes ele "não passa", e não é por falta de navegador — é pela assinatura. Este capítulo desce nessa camada. Antes de te entregar uma única linha de HTML, o servidor te avalia: como você abriu a conexão, o que seus cabeçalhos dizem, se você trouxe os cookies certos, se você seguiu o caminho. Passar por essas portas é o assunto aqui — e a lição que costura tudo é uma só: **o que te barra não é uma peça isolada, é a incoerência entre elas.**

### O porteiro invisível: a assinatura de TLS

Esse é o muro que mais gente bate sem entender. Você manda uma requisição, recebe um `403`, e conclui "preciso de navegador". Mas então abre o site no navegador, na mesma rede, e funciona. Mesma URL, headers parecidos — o que muda?

O que muda acontece **antes** do HTTP. Para falar HTTPS, cliente e servidor primeiro negociam a conexão criptografada (o *handshake* de TLS), e essa negociação tem uma impressão digital: a combinação de versões, cifras e extensões que o seu cliente oferece (é o que chamam de JA3/JA4). Cada biblioteca tem uma impressão distinta e conhecida — e alguns sistemas de defesa barram tudo que não tem cara de navegador real **antes mesmo de olhar o que você pediu.**

A saída é usar um cliente HTTP que **imita o handshake de um navegador**:

```python
# um cliente HTTP que assume o fingerprint TLS de um navegador real
from curl_cffi import requests

r = requests.get("https://exemplo.com", impersonate="chrome")
print(r.status_code)   # passa onde o cliente padrão tomava 403
```

**A pegadinha:** isso vence a checagem do handshake — não um desafio que exige *executar* JavaScript. Se, depois de passar no TLS, ainda vem uma página de "verificando seu navegador", aí o problema é outro e o degrau é o navegador.

### A identidade que você declara: os cabeçalhos

Passado o handshake, vêm os cabeçalhos HTTP — e o servidor lê todos. Falta de `User-Agent`, um `User-Agent` genérico, ou uma ordem de cabeçalhos que não bate com a do navegador que você diz ser: qualquer um desses te entrega. Pior ainda é a incoerência — dizer que é um navegador no cabeçalho e ter o handshake de outra coisa.

A regra é simples: conte **uma história consistente**. Cabeçalhos plausíveis e coerentes com o cliente que você está imitando.

```python
headers = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
    "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
    "Referer": "https://exemplo.com/",
}
r = requests.get(url, headers=headers, impersonate="chrome")
```

**A pegadinha:** centralize esses valores num lugar só. `User-Agent` copiado em dez arquivos vira dez versões diferentes com o tempo — e basta um destoar pra você ter um bug que só aparece "às vezes".

### O caminho e o estado: cookies, tokens e a ordem das coisas

Muitos sites não aceitam um POST direto no endereço do resultado. Eles exigem que você **tenha passado pelo caminho**: um cookie que só é setado na página inicial, um token de estado escondido no HTML do formulário, um identificador de sessão, um `Referer` que faça sentido. Pular etapas devolve um formulário vazio ou um erro educado — e você perde horas achando que o problema é outro.

A solução é reproduzir o caminho de um humano: primeiro o GET da página inicial (que te dá os cookies e o token embutido), depois o POST reusando tudo.

```python
s = requests.Session(impersonate="chrome")

# 1) GET inicial: a sessão guarda os cookies, e o HTML traz o token de estado
home = s.get("https://exemplo.com/busca")
token = BeautifulSoup(home.text, "html.parser").select_one("input[name=_token]")["value"]

# 2) POST reusando cookies (a sessão cuida) + o token + um Referer coerente
r = s.post("https://exemplo.com/busca",
           data={"_token": token, "q": "termo"},
           headers={"Referer": "https://exemplo.com/busca"})
```

**A pegadinha:** se o token não está embutido no HTML, mas é *gerado por JavaScript* no navegador, o GET não te entrega ele pronto — e aí você cai no caso de precisar executar JS.

### Quando o navegador é inevitável: o disfarce

Às vezes não tem escapatória e você vai pro navegador automatizado. Só que ele também tem marcas que o entregam: uma propriedade que anuncia "estou sob automação", uma lista de plugins vazia, a ausência de objetos que um navegador comum sempre tem. Scripts anti-bot leem exatamente isso.

A resposta é injetar, **antes de a página carregar seus scripts**, um trecho que sobrescreve essas marcas pra você parecer um navegador comum.

```python
# injeta o disfarce ANTES de a página rodar o JavaScript dela
page.add_init_script("""
  Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
  Object.defineProperty(navigator, 'plugins',   { get: () => [1, 2, 3] });
  window.chrome = { runtime: {} };
""")
page.goto("https://exemplo.com")
```

**A pegadinha (e essa é contraintuitiva):** alguns desafios **procuram justamente o disfarce** — eles detectam quem está tentando se esconder. Já vi um caso em que *desligar* o disfarce passava e ligá-lo bloqueava. Trate isso como uma chave que você liga e desliga por alvo, testando — nunca como um "deixa sempre ligado".

### A história precisa fechar

Repare no fio que costura o capítulo inteiro: o servidor raramente te barra por **uma** coisa. Ele te barra pela **incoerência**. Handshake de navegador, cabeçalhos de navegador, os cookies do fluxo, comportamento de navegador — tudo isso conta a mesma história. Quando uma peça destoa do resto, o porteiro percebe. Passar por essa camada é, no fundo, contar uma história consistente do primeiro handshake até o clique no botão de buscar.

Mas existe uma porta que história coerente nenhuma abre sozinha — ela te para na cara e pede que você prove, ali, que é humano. É o captcha, e é o próximo capítulo.

## Parte 4 · Captcha

*A porta que nenhuma coerência abre sozinha — e como atravessá-la sem perder dinheiro à toa.*

Captcha assusta quem está começando, mas o segredo é desarmar a expectativa logo: na prática, você quase nunca "resolve" um captcha sozinho. Você **terceiriza** a resolução para um serviço especializado, recebe um token válido de volta, e injeta esse token onde o site espera. O trabalho de verdade não é resolver — é **detectar qual captcha é**, **descobrir como entregá-lo certo ao serviço**, e **saber a hora de não insistir.**

### Antes de tudo: não resolva o que dá pra evitar

Resolver captcha custa dinheiro (o serviço cobra por resolução) e tempo (segundos por desafio). Então a primeira pergunta nunca é "como resolvo?", e sim "**preciso mesmo passar por aqui?**". Existe uma rota da API que não exige o captcha? Um fluxo alternativo no site? Uma página de resultado que não o dispara? Procure o desvio antes de pagar o pedágio. O solver é a última coisa que você adiciona, não a primeira.

### Detectar qual captcha é — e se está mesmo ligado

Cada tipo de captcha fala uma língua diferente, então o primeiro passo é identificar com qual você está lidando. A assinatura de cada um vive no HTML:

```python
soup = BeautifulSoup(html, "html.parser")

if soup.select_one("[data-sitekey]"):
    tipo = "widget_com_sitekey"      # injeta um token num campo escondido
elif "g-recaptcha-response" in html:
    tipo = "checkbox_ou_invisivel"
elif "data:image" in html:
    tipo = "imagem"                  # uma imagem embutida pra ler
```

**A armadilha — e essa derruba muita gente:** o captcha estar **carregado** no HTML não significa que ele está **ativo**. Já vi um alvo onde o reconhecimento acusava um captcha que estava desligado — havia um `if (false)` em volta da função que deveria dispará-lo, e o captcha de verdade era outro. Antes de gastar uma resolução, confirme qual desafio **dispara de fato**: olhe o `onclick` do botão de buscar e os `if(true)/if(false)` que cercam a função do captcha. Resolver o captcha errado é dinheiro no lixo.

### Resolver: o fluxo genérico

O padrão é sempre o mesmo, qualquer que seja o tipo: você manda ao serviço os parâmetros do desafio (a sitekey e a URL, ou os bytes da imagem), espera o token, e injeta esse token no campo escondido ou no parâmetro que o site espera.

```python
from twocaptcha import TwoCaptcha
solver = TwoCaptcha("SUA_API_KEY")

# widget com sitekey: manda sitekey + url, recebe o token pronto
token = solver.turnstile(sitekey=sitekey, url=url)["code"]

# captcha de imagem: manda os bytes, recebe o texto lido
texto = solver.normal("captcha.png")["code"]

# o token/texto entra no POST como se você tivesse resolvido na tela
```

### Captcha de imagem estática: às vezes nem precisa de serviço

Para o captcha mais simples — aquela imagem estática com letras ou números distorcidos — você nem sempre precisa de um serviço pago. Dá pra resolver localmente com **visão computacional**: um modelo de OCR roda na sua própria máquina, lê a imagem e devolve o texto. É **barato** (sem custo por resolução) e **rápido** (sem a ida e volta a um serviço externo) — e, pra um volume grande de um mesmo captcha de imagem, compensa muito.

```python
# captcha de imagem simples resolvido localmente, sem serviço pago
import easyocr

reader = easyocr.Reader(["en"])
texto = "".join(reader.readtext("captcha.png", detail=0))
```

**A pegadinha:** isso vale só pros simples. Captcha de widget, "selecione as imagens com…", ou o que avalia comportamento não caem por OCR — pra esses, é serviço (ou pior, veja o caso extremo mais adiante).

### A regra de ouro: não declare "irresolvível" cedo demais

Essa é a lição que mais economiza tempo — e dinheiro. Um dia fiquei num captcha que voltava erro atrás de erro; tudo indicava que era impossível resolver. Quase abandonei o alvo inteiro. A causa não era o captcha: era **um parâmetro que faltava**. O site carregava um script não-padrão, e o serviço de resolução precisava saber disso para resolver o desafio certo. No instante em que passei o parâmetro correto, resolveu de primeira.

A lição: **muito captcha "irresolvível" é só um parâmetro faltando.** Antes de desistir — leia a documentação do serviço para aquele tipo, confirme se a biblioteca tem o método, procure problemas já relatados por outras pessoas (o mesmo desafio provavelmente já travou alguém), e esgote os parâmetros opcionais. Testar costuma ser de graça quando o resultado é "não consegui resolver", então teste à vontade antes de cravar que é impossível.

### Leia a sitekey, não a fixe

A `sitekey` do captcha pode mudar entre deploys do site. Se você fixou ela no código, na próxima rotação você passa a pedir a resolução do captcha errado — e falha em silêncio. Extraia a sitekey do próprio HTML, em tempo de execução, sempre:

```python
sitekey = BeautifulSoup(html, "html.parser").select_one("[data-sitekey]")["data-sitekey"]
```

### O proxy e o IP de quem resolve

Um detalhe que pega quem usa proxy: muitos sites **cruzam o IP que resolveu o captcha com o IP que enviou a requisição.** Se o desafio foi resolvido de um lugar (o IP do serviço de resolução, por exemplo) e o formulário sai de outro (o seu proxy), esse descasamento é um sinal claro de automação — e o site rejeita, mesmo com o token "válido".

A regra: o captcha precisa ser resolvido **do mesmo IP** — ou ao menos da mesma reputação e geografia — de onde a requisição parte. É por isso que os serviços de resolução aceitam um proxy: pra resolver o desafio saindo do *seu* IP. Se você usa proxy na coleta, use o mesmo proxy na resolução.

```python
# resolve o captcha SAINDO do seu proxy, pro IP bater com o da requisição
token = solver.turnstile(sitekey=sitekey, url=url,
                         proxy={"type": "HTTP", "uri": "user:senha@host:porta"})["code"]
```

### O caso extremo: quando nem o captcha resolvido basta

Existe uma classe de sites realmente blindados onde o problema não é (só) o captcha. A página calcula um **score de confiança** do seu navegador e do seu comportamento e, mesmo com o captcha resolvido, devolve `false` e te bloqueia. Mudar cabeçalhos, locale, stealth — nada move o ponteiro, porque o muro não é o desafio: é "isto não parece uma pessoa de verdade num navegador de verdade".

Já vi essa situação de perto, e vale contar inteira porque mostra até onde a coisa vai. A gente não conseguia passar a barreira de jeito nenhum — nem com proxy, nem com o IP residencial local. Os suspeitos eram dois: o captcha (que, vindo de um IP de datacenter, já chega marcado com uma flag) e a própria confiabilidade da página, que avaliava o navegador. Provavelmente os dois ao mesmo tempo.

No começo parecia que não dava pra passar aquele captcha com aquele IP, e a missão foi abortada. Até aparecer uma **extensão de navegador — a do NopeCHA** — que resolve o captcha por interação real, dentro do próprio navegador. Isso abriu a chance de tirar a prova: o bloqueio era o captcha, ou era a página?

Com a extensão, o captcha passou a ser resolvido. E mesmo assim a página continuava identificando acesso automatizado. Pronto, pergunta respondida: o que sobrava era a confiabilidade. A barra estava alta o suficiente pra barrar um navegador dirigido por automação, com o captcha já resolvido. Tentamos mudar cabeçalhos — não bastou. Locale, stealth — nada. Precisava de um pulo maior: acessar a página como um usuário acessa de verdade.

A virada foi essa. Primeiro, instalar a extensão no navegador do container e configurar a chave; só então abrir a página. Nela, deixar a extensão resolver o captcha **primeiro** — e não tocar no formulário ao mesmo tempo, porque isso rouba o foco do teste do captcha e estraga tudo. Resolvido o captcha, aí sim preencher e enviar o formulário, **tudo com o mouse se movendo de verdade**: uma biblioteca movia o ponteiro até a posição dos botões na tela e clicava como um humano. Era frágil (dependia da posição dos elementos na tela), mas funcionou. E, dali em diante, era só raspar.

A lição: existe um teto em que disfarçar a conexão não basta — o site quer ver **comportamento humano**, e a única forma de provar é se comportar como humano de fato: um navegador real, a interação acontecendo de verdade (o mouse se movendo, cliques reais) e o captcha resolvido por uma interação genuína, não por um token injetado de fora. É caro, é frágil, é o último recurso entre os últimos recursos. Mas quando a barra é essa, é o que sobra.

E continua valendo a regra que abre e fecha este capítulo: **resolver o captcha não conserta uma sessão que o servidor já achou suspeita.** Se você apanha de captcha porque a sua conexão parece de robô, o token só adia o bloqueio — a causa está uma camada antes. Trate a causa, não o sintoma.

### O resumo

O captcha parece o muro mais alto e costuma ser o mais mecânico: identifique o tipo, confirme que ele está ligado, entregue os parâmetros certos a um serviço, injete o token. O que separa quem passa de quem desiste não é técnica avançada — é não cravar "impossível" sem antes pesquisar e esgotar os parâmetros.

Passada essa porta, o servidor finalmente te entrega o HTML. Só que agora começa um problema diferente: **extrair o dado de um jeito que não quebre amanhã** — e descobrir o que acontece quando você faz isso não uma, mas mil vezes. É o próximo capítulo.

## Parte 5 · Conteúdo & Escala

*Extrair o dado de um HTML hostil — e aguentar fazer isso mil vezes sem ser derrubado.*

Você passou pela porta e o servidor te entregou o HTML. Acabou o trabalho? Não — começou outro. Este capítulo tem duas metades. A primeira é **extrair o dado de um jeito que não quebre no próximo deploy do site**. A segunda é o que acontece quando você deixa de fazer isso uma vez e passa a fazer mil: a escala traz muros que uma requisição sozinha nunca mostra.

### Extrair: ancore no que é estável

O erro mais comum na extração é prender o seletor em algo que o site troca a toda hora. O exemplo clássico são **ids e classes gerados dinamicamente** — `field_a8f3c2` hoje, `field_19bd0e` no próximo deploy. Fixar o seletor nesse id é garantir que o parser quebre, e quebre em silêncio.

A regra é ancorar no que **não** muda. Em ordem de preferência: o *sufixo* estável do id, o **rótulo de texto** que fica ao lado do campo (esse quase nunca muda, porque um humano precisa lê-lo), ou um atributo semântico.

```python
# RUIM: preso a um id volátil — quebra no próximo deploy
soup.select_one("#form_a8f3c2_numero")

# BOM (a): casa pelo sufixo estável do id
soup.select_one("[id$='_numero']")

# BOM (b): acha pelo rótulo visível e pega o valor ao lado
label = soup.find("label", string=re.compile("Número"))
numero = label.find_next(class_="value").get_text(strip=True)
```

**A pegadinha:** se o site randomiza até o rótulo visível (raro), nem isso te salva — aí você vai por heurística de **conteúdo**: identifica o campo pelo formato do valor, não pela posição.

### Quando o dado vem por JavaScript

Se o conteúdo é montado por script (você viu isso lá no reconhecimento), tem dois caminhos. O melhor é **achar a requisição que alimenta o DOM** e consumir ela direto — quase sempre é um JSON, que muda menos que HTML e dispensa o navegador. Só quando não dá é que você renderiza — e aí o detalhe que pega todo mundo: **espere o conteúdo aparecer, não a resposta da rede.** Um DOM ainda vazio é idêntico à página inicial; espere o elemento que você quer existir.

```python
# preferível: consumir a API que alimenta o DOM (JSON, mais estável que HTML)
dados = requests.get("https://exemplo.com/api/resultados",
                     params={"q": "termo"}).json()

# se precisar do navegador: espere o CONTEÚDO, não só a resposta
page.wait_for_selector("[id$='tabela'] tr", timeout=6000)
```

### Parsing que dobra em vez de quebrar

HTML do mundo real é irregular: campos faltam em alguns registros, tabelas vêm com colunas em ordem diferente, um item no meio do lote chega malformado. Um parser rígido explode no primeiro desvio e leva o lote inteiro junto. Um parser bom **degrada**: isola cada item, tolera ausência, e nunca confia em posição fixa.

```python
resultados = []
for linha in linhas:
    try:
        resultados.append(extrair(linha))
    except Exception as e:
        log.warning("item ignorado: %s", e)   # 1 item ruim != lote perdido

# busca a coluna pelo CABEÇALHO, não por índice fixo (sobrevive a reordenação)
col = {th.get_text(strip=True): i for i, th in enumerate(cabecalhos)}
data = celulas[col["Data/Hora"]].get_text(strip=True)
```

**A pegadinha:** tolerância demais tem um custo escondido — se *todos* os itens passarem a falhar, o `try/except` engole o sintoma e você não percebe que parou de extrair. Guarde essa tensão; ela é o tema do último capítulo.

### Escala: a concorrência também é a sua sonda

Agora a segunda metade. Fazer mil vezes não é só "repetir num loop" — a escala muda o comportamento do alvo. Servidores detectam padrões de requisição previsíveis, e muitos bloqueios (limite de taxa, WAF) **só aparecem sob carga**. Por isso a concorrência tem um papel duplo: ela acelera a coleta **e** revela o muro — de preferência no seu teste, não em produção.

Na prática, você divide a entrada em N trabalhadores, cada um com sua própria sessão isolada, e devolve os resultados por uma fila — sem travas no caminho dos dados, só nos contadores compartilhados.

```python
import threading, queue

fila = queue.Queue()

def worker(sublote):
    cliente = nova_sessao()             # sessão/contexto isolado por thread
    for doc in sublote:
        fila.put(processar(doc, cliente))

# para navegador, o equivalente barato é 1 processo com N contextos isolados,
# em vez de abrir N navegadores (que custa memória e te denuncia pelo volume).
```

**A pegadinha:** concorrência demais vira um auto-ataque de negação de serviço — você derruba o alvo ou acelera o próprio bloqueio. Existe um ponto ótimo por site; ache empiricamente, começando alto num lote pequeno e baixando até a taxa de erro estabilizar.

### Falhar com elegância: retry, backoff e o disjuntor

Sob escala, falhas deixam de ser exceção e viram rotina — e você precisa de três defesas. **Retry com espera crescente** (1s, 2s, 4s) para o que é transitório. **Rotação de IP** quando vêm muitos timeouts seguidos (sinal de bloqueio progressivo). E um **disjuntor**: se acontecem N falhas *consecutivas* sem nenhum sucesso no meio, o problema é sistêmico — o site caiu, mudou, ou te bloqueou de vez — e insistir só queima a fila (e, se há captcha, créditos reais). Melhor abortar e avisar uma vez.

```python
import time

def com_retry(fn, tentativas=3):
    for i in range(tentativas):
        try:
            return fn()
        except ERROS_DE_REDE:
            if i == tentativas - 1:
                raise
            time.sleep(2 ** i)          # 1s, 2s, 4s

# disjuntor: falhas consecutivas somadas entre os trabalhadores; sucesso zera
if falhas_consecutivas >= LIMITE:
    parar = True                        # aborta o lote em vez de queimar tudo
```

**A pegadinha:** backoff cego contra um bloqueio definitivo só adia o inevitável. O disjuntor é justamente o reconhecimento de que, passado um limite, insistir é desperdício — a resposta certa é parar e investigar.

### O fecho

Extrair bem é ancorar no estável e fazer o parser dobrar em vez de quebrar. Escalar bem é tratar a concorrência como sonda e ter um jeito de parar com elegância quando o muro aparece. Com isso, você tem um scraper que funciona — hoje.

E aqui mora o último e mais traiçoeiro inimigo, aquele que nenhuma técnica deste capítulo pega sozinha: o dia em que o site muda e o seu scraper **continua "funcionando"** — sem erro, sem alarme, gravando lixo na sua base enquanto você dorme tranquilo. Como perceber isso antes de a base contaminar é o assunto do último capítulo.

## Parte 6 · Scraping a longo prazo

*O scraper que funciona hoje vai quebrar — e o pior é que não vai avisar. Este capítulo é sobre tornar a falha barulhenta.*

Todos os capítulos até aqui foram sobre fazer o scraper **funcionar**. Este é sobre mantê-lo funcionando — e é a parte que separa um script de um sistema. Quase ninguém escreve sobre ela, e é justamente onde mora a diferença entre uma coleta que dura uma tarde e uma que dura meses.

### O inimigo real: a falha silenciosa

Um scraper raramente morre com um erro limpo. O que acontece é pior. O site muda o nome de um campo, o seu seletor passa a achar nada, o parser tolerante (que você fez dobrar em vez de quebrar, lá na Parte 5) engole o vazio, o `INSERT` grava um registro em branco — e tudo continua "rodando". Nenhum erro. Nenhum alarme. Você descobre semanas depois, com a base já cheia de lixo.

Todas as técnicas a seguir existem para uma única coisa: transformar essa falha invisível em um **alarme barulhento**.

### Detecção proativa: a assinatura versionada

A primeira defesa é barata e preventiva. Com **um GET por alvo**, você extrai uma "assinatura" do que é estável entre uma visita e outra — os nomes dos campos do formulário, a presença e o estado do captcha, a sitekey — e compara com um **baseline guardado no versionamento**. Roda isso periodicamente (um cron). Quando algo muda, vira um diff que você revisa: ou é uma mudança legítima (e você atualiza o baseline) ou é uma regressão (e você conserta **antes** de a produção gravar lixo).

```python
def assinatura(html):
    soup = BeautifulSoup(html, "html.parser")
    return {
        "campos":  sorted(i.get("name") for i in soup.select("input[name]")),
        "captcha": detectar_tipo(html),
        "sitekey": (soup.select_one("[data-sitekey]") or {}).get("data-sitekey"),
    }

nova = assinatura(requests.get(URL).text)
if nova != json.load(open("baseline.json")):
    alertar(nova)   # revise ANTES de a produção rodar em cima de uma mudança
```

> **O detalhe que evita o falso positivo:** se os ids do formulário são randômicos, **normalize-os** antes de comparar (troque o sufixo volátil por um placeholder). Sem isso, todo deploy do site vira um "mudou" falso, e você aprende a ignorar o alarme — que é exatamente como alarmes morrem.

### Detecção comportamental: o gabarito

A assinatura pega "a estrutura mudou". Mas o parser pode parar de extrair com a estrutura **idêntica** — um seletor que casava deixou de casar por um detalhe sutil. Só rodar o scrape de verdade pega isso. Para isso serve um **gabarito versionado** por alvo: uma entrada de teste conhecida-boa, o número mínimo de resultados que ela deve devolver, e os campos que **nunca** podem vir vazios. Você roda o scrape real contra o gabarito e afirma as duas coisas.

```python
gabarito = {"entrada": "<entrada de teste>", "min_results": 1,
            "campos_obrig": ["numero", "data", "partes"]}

res = scrape(gabarito["entrada"])
assert len(res) >= gabarito["min_results"]
for campo in gabarito["campos_obrig"]:
    assert any(r.get(campo) for r in res), f"{campo} sempre vazio — o seletor quebrou"
```

**A nuance:** derive o gabarito de um run real — a interseção dos campos que vieram preenchidos em *todos* os resultados — em vez de escrever à mão. Assim ele reflete o que o alvo realmente entrega, e não a sua suposição do que deveria entregar.

### Consertar de graça: o replay offline

Quando um seletor quebra, o ciclo ingênuo de conserto é caríssimo: cada tentativa significa rede, captcha e navegação completa só pra testar uma regex. A saída é separar o **parser** do resto e rodá-lo **offline, contra um HTML que um run anterior já salvou**. Sem rede, sem captcha, sem navegador — você itera o seletor em milissegundos e valida contra o gabarito com um PASS/FAIL. Isso exige uma única decisão de design lá atrás: que a função de parse receba o HTML como argumento e **não busque nada por dentro**.

```python
# parser PURO: recebe HTML, devolve dados. NÃO faz rede por dentro.
def parse_detalhe(html, doc):
    ...

# replay: roda só o parser contra um HTML salvo de um run anterior
html = open("captura/resposta_200.html").read()
dados = parse_detalhe(html, doc)
conferir_contra_gabarito(dados)   # PASS/FAIL sem ir à produção
```

> **Por que isso importa tanto:** essa separação — um parser puro, sem efeitos colaterais — é a decisão que torna todo o resto barato. Testável offline, diagnosticável, à prova de regressão. É a diferença entre depurar no escuro e depurar com a luz acesa.

### Persistência que sobrevive à queda

Coleta longa cai no meio — rede, reboot, bloqueio. Sem cuidado, retomar significa ou reprocessar tudo (caro, e arriscando duplicar) ou perder o que faltava. Duas técnicas resolvem. **Escrita idempotente**: uma chave única e "atualize se já existe", de modo que rodar duas vezes dê o mesmo resultado que rodar uma. E **retomada inteligente**: antes de cada execução, cruze a entrada com o que já foi coletado e processe só o que falta.

```sql
-- idempotente: a 2a vez não duplica, atualiza
INSERT INTO resultado (chave, dados) VALUES (:chave, :dados)
ON DUPLICATE KEY UPDATE dados = VALUES(dados);
```

```python
# retomada: separa o que já existe do que falta, em lote
ja_feitos = consultar_existentes(entradas)
faltam    = [e for e in entradas if e not in ja_feitos]
```

> **Drift de esquema também é silencioso:** se o código de leitura espera uma coluna que o banco não tem mais (renomeada, migrada), muitos bancos deixam o `SELECT` falhar de um jeito que o aplicativo engole — e a deduplicação para de funcionar sem erro visível. Vale uma checagem que confirma, antes de cada release, que as colunas que você lê ainda existem.

Com isso fecha o arsenal de longo prazo: detectar a quebra antes de ela contaminar a base, consertar de graça, e persistir de um jeito que sobrevive a quedas. O scraper deixa de ser algo que "rodou ontem" e vira algo em que você confia amanhã.

## Parte 7 · Fechamento

*O artigo em uma página — e o que fazer com ele.*

### De volta às seis fases

Voltamos ao começo. Lá na Parte 1, desenhamos seis fases para construir um scraper. Agora, com o ferramental e as técnicas na mão, elas se fecham assim:

1. **Reconhecimento** — abra o DevTools, não o editor. A pergunta-mãe (API ou HTML por JS) escolhe sua ferramenta.
2. **Abordagem** — a mais barata que resolve. Navegador é o último recurso, não o primeiro.
3. **Reproduzir** — faça **um** resultado funcionar, na mão, antes de pensar em mil.
4. **Extração** — ancore no estável; veja o HTML real; faça o parser dobrar, não quebrar.
5. **Escala** — concorrência é sonda além de performance; tenha como parar com elegância.
6. **Manutenção** — assuma que vai quebrar em silêncio, e construa o alarme antes.

Se eu pudesse reduzir o artigo inteiro a uma frase, seria esta: **a parte difícil do scraping não é extrair uma página — quase todo mundo consegue. É saber, no dia seguinte, que você ainda está extraindo a coisa certa.** Quem entende isso para de escrever scripts descartáveis e começa a construir sistemas que duram.

### Por onde começar amanhã

Não tente montar tudo de uma vez. Pegue um alvo simples — um que devolva o dado em HTML do servidor, sem captcha — e percorra só as três primeiras fases: reconheça no DevTools, escolha o caminho HTTP, e faça um resultado sair. Só isso já é um scraper. Quando bater num muro — uma assinatura barrada, um captcha, um id que muda — você volta ao capítulo que trata dele. Este artigo é mapa, não receita: você não precisa de tudo de uma vez, precisa da peça certa na hora certa.

### Uma palavra sobre responsabilidade

Toda técnica aqui serve para passar por uma defesa que alguém colocou de propósito — e isso pede critério. Raspe só o que você tem direito de acessar; respeite os termos de uso, o `robots.txt` e a lei de proteção de dados de quem você acessa; e não martele um servidor a ponto de prejudicá-lo (a Parte 5 também é sobre isso — concorrência demais é um ataque, não uma coleta). A linha entre automação e abuso costuma ser exatamente essa: a primeira coleta, com cuidado, o que poderia ser coletado à mão; a segunda nem pergunta se deveria. Seja a primeira.

  <!-- ───────────────── RENDERIZAÇÃO + NAVEGAÇÃO POR CAPÍTULO ───────────────── -->
  <script>
    (function () {
      var src = document.getElementById('article-source').textContent;
      var content = document.getElementById('content');
      function slug(t) {
        return ((t || '').toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9\s-]/g, '').trim()
          .replace(/\s+/g, '-')) || 'sec';
      }
      function md(s) { return DOMPurify.sanitize(marked.parse(s)); }
      function hl(root) {
        root.querySelectorAll('pre code').forEach(function (el) {
          try { hljs.highlightElement(el); } catch (e) {}
        });
      }

      // ---- divide o MARKDOWN BRUTO nos marcadores "## Parte" (robusto, não depende do DOM) ----
      var blocks = src.split(/\n(?=#{2}\s+Parte\b)/);
      var headerMd = '', chapMds = [];
      blocks.forEach(function (b) {
        if (/^\s*#{2}\s+Parte\b/.test(b)) chapMds.push(b);
        else if (!chapMds.length) headerMd += (headerMd ? '\n' : '') + b;
        else chapMds[chapMds.length - 1] += '\n' + b;
      });

      content.innerHTML = '';
      var header = document.createElement('div');
      header.className = 'article-header';
      header.innerHTML = md(headerMd);
      hl(header);
      content.appendChild(header);

      var h1 = header.querySelector('h1');
      if (h1) document.title = h1.textContent;

      // ---- renderiza cada capítulo na sua própria seção ----
      var data = chapMds.map(function (cmd, i) {
        var sec = document.createElement('section');
        sec.className = 'chapter';
        sec.id = 'cap-' + i;
        sec.innerHTML = md(cmd);
        hl(sec);
        content.appendChild(sec);
        var titleEl = sec.querySelector('h2');
        var title = titleEl ? titleEl.textContent.trim() : ('Capítulo ' + (i + 1));
        var subs = Array.prototype.slice.call(sec.querySelectorAll('h2, h3'))
          .filter(function (h) { return h !== titleEl; });
        subs.forEach(function (h, k) { h.id = 'c' + i + '-' + slug(h.textContent) + '-' + k; });
        return { sec: sec, title: title, subs: subs };
      });

      var chapNav = document.getElementById('chapter-nav');
      var tocNav = document.getElementById('toc-nav');
      var obs = null;

      data.forEach(function (cd, i) {
        var a = document.createElement('a');
        a.href = '#cap-' + i;
        a.textContent = cd.title;
        a.addEventListener('click', function (e) { e.preventDefault(); show(i); });
        chapNav.appendChild(a);
      });

      function buildToc(i) {
        tocNav.innerHTML = '';
        data[i].subs.forEach(function (h) {
          var a = document.createElement('a');
          a.href = '#' + h.id;
          a.textContent = h.textContent;
          a.className = (h.tagName === 'H3') ? 'lvl-3' : 'lvl-2';
          tocNav.appendChild(a);
        });
      }

      function observe(i) {
        if (obs) obs.disconnect();
        var links = {};
        Array.prototype.slice.call(tocNav.children).forEach(function (a) {
          links[a.getAttribute('href').slice(1)] = a;
        });
        obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              Object.keys(links).forEach(function (k) { links[k].classList.remove('active'); });
              if (links[en.target.id]) links[en.target.id].classList.add('active');
            }
          });
        }, { rootMargin: '-70px 0px -75% 0px' });
        data[i].subs.forEach(function (h) { obs.observe(h); });
      }

      function show(i) {
        data.forEach(function (cd, j) { cd.sec.style.display = (j === i) ? '' : 'none'; });
        Array.prototype.slice.call(chapNav.children).forEach(function (a, j) {
          a.classList.toggle('active', j === i);
        });
        buildToc(i);
        observe(i);
        window.scrollTo(0, 0);
      }

      // botões anterior / próximo no fim de cada capítulo
      data.forEach(function (cd, i) {
        var bar = document.createElement('div');
        bar.className = 'chapter-nav-btns';
        if (i > 0) {
          var p = document.createElement('a');
          p.className = 'cbtn prev'; p.href = '#cap-' + (i - 1);
          p.textContent = '← ' + data[i - 1].title;
          p.addEventListener('click', function (e) { e.preventDefault(); show(i - 1); });
          bar.appendChild(p);
        }
        if (i < data.length - 1) {
          var n = document.createElement('a');
          n.className = 'cbtn next'; n.href = '#cap-' + (i + 1);
          n.textContent = data[i + 1].title + ' →';
          n.addEventListener('click', function (e) { e.preventDefault(); show(i + 1); });
          bar.appendChild(n);
        }
        cd.sec.appendChild(bar);
      });

      // abre o capítulo do hash, se houver
      var start = 0;
      if (location.hash) {
        var id = location.hash.slice(1);
        data.forEach(function (cd, i) {
          if (cd.sec.id === id || cd.subs.some(function (h) { return h.id === id; })) start = i;
        });
      }
      show(start);
    })();
  </script>
