# O ferramental

*As quatro peças que montam qualquer scraper, e quando usar cada uma.*

São quatro ferramentas, e você quase nunca usa todas ao mesmo tempo: escolhe conforme a decisão que já tomou. Os exemplos de código abaixo são ilustrativos; o raciocínio vale em qualquer linguagem.

## O cliente HTTP

É a peça que fala HTTP direto com o servidor, manda uma requisição e recebe a resposta (HTML ou JSON), sem abrir navegador. É a mais leve e rápida da caixa, e resolve a maioria dos casos: tudo que é API ou HTML renderizado no servidor. Comece sempre por aqui.

```python
import requests

r = requests.get("https://exemplo.com/busca", params={"q": "termo"})
print(r.status_code)          # 200?
dados = r.json()              # se a resposta for de uma API
# html = r.text               # ou o HTML cru, se for pra parsear
```
```javascript
const url = "https://exemplo.com/busca?" + new URLSearchParams({ q: "termo" });
const r = await fetch(url);
console.log(r.status);              // 200?
const dados = await r.json();       // se a resposta for de uma API
// const html = await r.text();     // ou o HTML cru, se for pra parsear
```

A pegadinha é que o cliente HTTP padrão tem uma assinatura reconhecível, e alguns sites barram exatamente isso antes de entregar qualquer coisa. Quando ele "não passa", nem sempre é porque você precisa de navegador; muitas vezes é só a assinatura.

## A biblioteca de parsing de HTML

Quando a resposta vem em HTML, e não em JSON, você precisa transformar aquele texto bruto numa árvore navegável pra pescar cada campo por seletor: uma tag, uma classe, um id, ou o texto de um rótulo ao lado. Se o caminho foi a API, você nem precisa dela, porque o JSON já chega estruturado.

```python
from bs4 import BeautifulSoup

soup = BeautifulSoup(html, "html.parser")
titulo = soup.select_one("h1.titulo").get_text(strip=True)
linhas = soup.select("table#resultados tr")
```
```javascript
const cheerio = require("cheerio");

const $ = cheerio.load(html);
const titulo = $("h1.titulo").text().trim();
const linhas = $("table#resultados tr");
```

O jeito como você escreve o seletor decide se o parser sobrevive ao próximo deploy do site. Um seletor preso a uma classe gerada (`field_a8f3c2`) ou à posição numa tabela quebra no próximo deploy; um ancorado no rótulo de texto aguenta.

## O navegador automatizado

Um navegador de verdade, dirigido por código. Ele carrega a página, executa o JavaScript, clica, preenche e espera o conteúdo aparecer, tudo que o cliente HTTP não faz. O preço é alto: ordens de magnitude mais lento e mais pesado, e mais fácil de detectar. Por isso é o último recurso, e entra só quando o conteúdo é montado por JavaScript, quando há um desafio de página inteira, ou quando um captcha invisível reprova um ambiente headless.

Esse navegador roda em dois modos. No headless ele faz tudo (carrega a página, executa o JavaScript, monta o DOM) sem abrir uma janela visível, o que o deixa bem mais leve e rápido. É o modo certo para o caso comum: um site que só monta o conteúdo por JavaScript, mas não inspeciona quem está acessando. Quando o alvo passa a checar o ambiente (procurar marcas de automação, exigir comportamento humano, calcular um score de confiança), o headless costuma ser detectado, e aí você sobe para um navegador visível (headed), com janela, rodando como o de uma pessoa. Comece sempre pelo headless; só troque pelo visível quando o site provar que checa.

```python
from playwright.sync_api import sync_playwright

with sync_playwright() as p:
    browser = p.chromium.launch(headless=True)
    page = browser.new_page()
    page.goto("https://exemplo.com")
    page.fill("#busca", "termo")
    page.click("#enviar")
    page.wait_for_selector("#resultados tr")   # espera o CONTEÚDO, não só a resposta
    html = page.content()
```
```javascript
const { chromium } = require("playwright");

const browser = await chromium.launch({ headless: true });
const page = await browser.newPage();
await page.goto("https://exemplo.com");
await page.fill("#busca", "termo");
await page.click("#enviar");
await page.waitForSelector("#resultados tr");   // espera o CONTEÚDO, não só a resposta
const html = await page.content();
```

Um detalhe que pega todo mundo: esperar a resposta da rede não é a mesma coisa que esperar o conteúdo aparecer. Espere o elemento que você quer existir no DOM, senão você lê uma página ainda vazia e jura que o site mudou.

## O serviço de resolução de captcha

Quando há um captcha no caminho e não dá pra desviar, você terceiriza a resolução. Manda os parâmetros do desafio para um serviço externo, recebe um token válido e injeta esse token na requisição ou no campo da página. É a última coisa que você adiciona, porque custa dinheiro e segundos.

```python
# serviço externo de resolução (há vários: 2Captcha, NopeCHA, etc.)
from twocaptcha import TwoCaptcha

solver = TwoCaptcha("SUA_API_KEY")
resultado = solver.turnstile(sitekey="0x4AAA...", url="https://exemplo.com")  # ex.: Cloudflare Turnstile
token = resultado["code"]          # injeta no campo/parâmetro que o site espera
```
```javascript
// serviço externo de resolução (há vários: 2Captcha, NopeCHA, etc.)
const { Solver } = require("@2captcha/2captcha");

const solver = new Solver("SUA_API_KEY");
const res = await solver.turnstile("0x4AAA...", "https://exemplo.com");  // ex.: Cloudflare Turnstile
const token = res.data;            // injeta no campo/parâmetro que o site espera
```

Resolver o captcha não conserta uma sessão que o servidor já achou suspeita. Se você está apanhando de captcha porque a sua conexão parece de robô, o token só adia o bloqueio, e a causa está uma camada antes.

## Resumo

São quatro peças: cliente HTTP como padrão, biblioteca de parsing quando a resposta vem em HTML, navegador só quando há JavaScript de verdade, e serviço de captcha por último. Use a combinação mínima que resolve o alvo.
