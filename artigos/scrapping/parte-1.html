# Parte 1 · Como pensar um scraper

*Como decidir tudo antes de escrever a primeira linha de código.*

Existe um abismo entre "extrair dados de uma página" e "ter uma automação que coleta de um site que não quer ser automatizado, todos os dias, por meses". Quase todo tutorial te ensina o primeiro: faz um GET, joga o HTML num parser, pega o campo. Aqui a gente fala do segundo, e ele começa antes do código.

A primeira ferramenta de um scraper é o DevTools do navegador, não o editor. As decisões que definem se o projeto vai ser uma tarde tranquila ou uma semana no escuro são tomadas antes de você escrever uma linha. Este capítulo é sobre elas, e por isso não tem código nenhum.

## O erro número um

Quem começa escreve código contra o site que está vendo na tela: o HTML renderizado. O problema é que isso quase nunca é o que chega pela rede. O navegador baixa o HTML, executa o JavaScript, faz mais dez requisições por baixo e monta a página. Quando você inspeciona um elemento, está vendo o resultado final, não a matéria-prima que o servidor mandou. Escreva um scraper em cima disso e vai perder horas tentando entender por que o seu código recebe um HTML vazio enquanto o navegador mostra a tabela cheia.

A regra é simples: mapeie o site antes de codar. Esses minutos na aba Network dizem se o dado vem pronto ou é montado por JavaScript, e é isso que escolhe a ferramenta.

## A decisão que define o projeto inteiro

Uma pergunta decide a ferramenta, a velocidade e a dificuldade de todo o resto:

> O conteúdo vem pronto numa requisição, ou é montado no navegador por JavaScript?

De um lado, um scraper de 30 linhas com um cliente HTTP. Do outro, um projeto cheio de navegador e espera de renderização. E você não responde no chute: abre o DevTools e olha.

### O procedimento

Abra o DevTools (F12), vá em Network, filtre por Fetch/XHR e marque Preserve log. Faça a busca à mão no navegador e veja o que aparece na rede. Você cai num de três casos:

- Uma requisição XHR/Fetch já devolve os dados em JSON. É o melhor caso: vá direto nessa API com um cliente HTTP. JSON muda menos que HTML, então o scraper fica mais estável.
- Nenhuma XHR traz os dados, mas eles já estão no documento HTML (a requisição do tipo *document*). O site renderiza no servidor: baixe com um cliente HTTP e extraia com uma biblioteca de parsing.
- Os dados só existem no DOM renderizado, montados por JavaScript. Aqui, e só aqui, vale um navegador automatizado.

Confirme antes de codar: botão direito na requisição, "Copy as cURL", e rode no terminal. Se devolver os dados fora do navegador, o caminho HTTP está provado. Se só funciona dentro dele, você já sabe que vai precisar de um navegador. Aproveite e anote o que importa depois: cookies, tokens, cabeçalhos exigidos (`Referer`, `X-CSRF-Token`), captcha no fluxo, status codes, redirects.

### A regra de ouro

A ferramenta sai do que você viu na rede, não da sua preferência: o navegador é mais lento, mais frágil e mais fácil de detectar que um cliente HTTP, então entra só quando os outros dois casos não dão conta.

## Metodologia

Todo scraper percorre o mesmo fluxo, e cada etapa alimenta a seguinte: a saída de uma é a entrada da próxima.

```text
alvo
 │
 ├─ 1. reconhecimento  →  DevTools (Network/XHR); Copy as cURL pra provar
 │       └─ pergunta principal: dado pronto, ou montado por JavaScript?
 │            ├─ JSON numa XHR ......... cliente HTTP (melhor caso)
 │            ├─ no HTML do documento .. cliente HTTP + parsing
 │            └─ só no DOM por JS ...... navegador automatizado
 │
 ├─ 2. abordagem  →  o mais barato que resolve; navegador é o último recurso
 │       └─ captcha? imagem/token → serviço externo ou OCR local
 │                   comportamento/página inteira → navegador
 │
 ├─ 3. reproduzir  →  faça 1 resultado sair na mão, antes do loop
 │       └─ a porta, se o servidor barrar: fingerprint de TLS, cabeçalhos
 │          coerentes e ordenados, campos do form + cookies, disfarce do
 │          navegador, proxy se o IP destoar
 │
 ├─ 4. extração  →  veja o HTML real; ancore por rótulo, sufixo ou formato
 │       └─ parser que dobra: isola item, tolera ausência, ignora posição
 │
 ├─ 5. escala  →  concorrência como sonda; o bloqueio aparece sob carga
 │       ├─ retry com espera crescente (1s, 2s, 4s)
 │       ├─ rotação de IP: manual (lista) ou proxy rotativo
 │       └─ disjuntor: N falhas seguidas → aborta o lote
 │
 └─ 6. manutenção  →  assuma que vai quebrar calado; construa o alarme
         ├─ assinatura versionada (1 GET) → diff estrutural
         ├─ gabarito comportamental: presença + forma do valor
         └─ replay offline do parser (HTML salvo, sem rede)
```

Esse é o mapa. O resto desta parte abre cada etapa dele, uma a uma.

## As seis fases

Reconhecer e decidir a abordagem é o coração das duas primeiras fases. O caminho completo, do primeiro contato até a coleta em produção, tem seis.

### Fase 1 · Reconhecimento

Antes de escolher ferramenta, mapeie o alvo. Além da pergunta principal (API ou JavaScript), descubra a entrada e a saída que você quer, se há login, sessão ou token de estado, se há captcha e de que tipo, se há paginação, e o volume esperado. Anote tudo na mesma passada em que lê a rede. E cuidado com uma armadilha comum: uma defesa pode estar no código, mas desligada. Um captcha pode aparecer no HTML e nunca disparar: às vezes está simplesmente desativado, às vezes o site trocou de captcha e deixou a implementação antiga para trás. O `<script>` carregado não quer dizer que ele dispara. Confirme olhando o que acontece quando você clica em buscar.

### Fase 2 · Escolha da abordagem

A pergunta principal já diz se o caminho base é HTTP ou navegador. O captcha é a segunda variável. Captcha de imagem ou token que vira parâmetro: o HTTP ainda serve, você resolve com um serviço externo e injeta o token. Captcha invisível por comportamento ou desafio de página inteira: aí o navegador é necessário.

Tem um caso traiçoeiro. Quando o botão de buscar dispara uma função JavaScript que usa um id de componente gerado automaticamente, o navegador costuma ganhar. Um alvo pode devolver "zero resultados" com o captcha resolvido e válido sem que o captcha seja o culpado. Alguns frameworks disparam a busca por uma função que envia um id interno do componente (algo como `comp_8f3a2`), não o `name` do botão visível. Quem reproduz a requisição no cliente HTTP tende a mandar o id visível; o servidor não reconhece e responde com zero resultados. No navegador, você chama a função da própria página e o id certo se resolve sozinho. "Zero resultados com tudo certo" quase sempre é id de submit errado, não a sua busca.

### Fase 3 · Reproduzir o fluxo

Antes de qualquer loop, extraia um resultado na mão. Descubra a requisição exata que devolve o dado (método, cabeçalhos, corpo, cookies, token) e confirme que ela funciona isolada, fora do navegador. Se o alvo tem captcha, gaste uma resolução só pra alcançar a página real e ver o HTML que você vai parsear. Não automatize em escala o que você ainda não fez funcionar uma vez: loop em cima de uma requisição que você não entende só multiplica o erro.

### Fase 4 · Extração

Olhe o HTML real e escolha a âncora pela volatilidade do que você vê. Id gerado a cada deploy você não prende: ancora no sufixo estável dele, ou troca o id pelo rótulo de texto ao lado do campo, que quase não muda porque um humano precisa lê-lo. Sem rótulo confiável, sobra a regex pelo formato do valor. E não pegue cada item por um id próprio: ancore no container estável, a tabela, e itere as linhas lendo a coluna pelo cabeçalho, nunca pela posição. Por fim, tolere campo ausente, para um registro torto virar aviso e não a queda do lote.
### Fase 5 · Escala e robustez

Requisições em escala causam diversos bloqueios (Rate Limit, WAF, sobrecarga do servidor), e muitos só aparecem sob carga. Suba a concorrência aos poucos, usando ela como sonda: melhor o alvo te barrar no teste do que em produção. Quando o bloqueio vier, segure o tranco com retry de espera crescente para falhas passageiras e um disjuntor que aborta o lote quando as falhas viram regra. E o óbvio: não dispare cinquenta threads de cara nem insista contra um muro que não vai ceder.

### Fase 6 · Manutenção

É a fase que separa um script de um sistema, e a mais ignorada. Um scraper raramente morre com erro limpo. Ele falha calado: o site muda, o parser passa a achar nada, e a base enche de registro vazio sem nenhum aviso. Você só descobre muito tempo depois. O trabalho aqui é ter um alarme de quebra, porque a falha de um scraper é silenciosa por natureza. Nunca confie no "rodou ontem, então roda hoje".

## O resumo de bolso

Antes da primeira linha de um scraper: abra o DevTools, não o editor, e leia a rede. Responda a pergunta principal (API ou JavaScript), que é quem escolhe a ferramenta. Prove o caminho com um Copy as cURL antes de codar. Veja o HTML real antes do parser. Faça um resultado funcionar antes de fazer mil. E planeje o alarme de quebra desde já, porque ele vai quebrar, e calado.
