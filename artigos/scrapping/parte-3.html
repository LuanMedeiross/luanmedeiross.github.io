# Parte 3 · Conexão &amp; Sessão

*O muro antes do conteúdo: fazer o servidor te aceitar como um cliente legítimo.*

Antes de entregar uma única linha de HTML, o servidor te avalia: como você abriu a conexão, o que seus cabeçalhos dizem, se você trouxe os cookies certos, se você seguiu o caminho. Passar por cada uma dessas portas é o assunto deste capítulo, e a lição que costura tudo é uma só: o que te derruba raramente é uma peça sozinha, e sim a incoerência entre elas.

## O porteiro invisível: a assinatura de TLS

Esse é o muro que mais gente bate sem entender. Você manda uma requisição, recebe um `403`, e conclui que precisa de navegador. Mas então abre o site no navegador, na mesma rede, e funciona. Mesma URL, cabeçalhos parecidos. O que muda?

O que muda acontece antes do HTTP. Para falar HTTPS, cliente e servidor primeiro negociam a conexão criptografada, o *handshake* de TLS, e essa negociação tem uma impressão digital: a combinação de versões, cifras e extensões que o seu cliente oferece, o que chamam de JA3/JA4. Cada biblioteca tem uma impressão própria e conhecida, e alguns sistemas de defesa barram tudo que não tem cara de navegador real antes mesmo de olhar o que você pediu.

A saída é usar um cliente HTTP que imita o handshake de um navegador.

```python
# um cliente HTTP que assume o fingerprint TLS de um navegador real
from curl_cffi import requests

r = requests.get("https://exemplo.com", impersonate="chrome")
print(r.status_code)   # passa onde o cliente padrão tomava 403
```

Isso vence a checagem do handshake, mas não um desafio que exige executar JavaScript. Se, depois de passar no TLS, ainda vem uma página de "verificando seu navegador", o problema é outro e você vai precisar do navegador.

## A identidade que você declara: os cabeçalhos

Passado o handshake, vêm os cabeçalhos HTTP, e o servidor lê todos. Falta de `User-Agent`, um `User-Agent` genérico, ou uma ordem de cabeçalhos que não bate com a do navegador que você diz ser: qualquer um desses te entrega. Pior é a incoerência, tipo dizer que é um navegador no cabeçalho e ter o handshake de outra coisa. A regra é contar uma história consistente, com cabeçalhos coerentes com o cliente que você está imitando.

```python
headers = {
    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36",
    "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
    "Referer": "https://exemplo.com/",
}
r = requests.get(url, headers=headers, impersonate="chrome")
```

Um detalhe que poupa dor de cabeça: centralize esses valores num lugar só. `User-Agent` copiado em dez arquivos vira dez versões diferentes com o tempo, e basta uma destoar pra você ter um bug que só aparece "às vezes".

## O caminho e o estado: cookies, tokens e a ordem das coisas

Muitos sites não aceitam um POST direto no endereço do resultado. Eles exigem que você tenha passado pelo caminho: um cookie que só é setado na página inicial, um token de estado escondido no HTML do formulário, um identificador de sessão, um `Referer` que faça sentido. Pular etapas devolve um formulário vazio ou um erro educado, e você perde horas achando que o problema é outro. A solução é reproduzir o caminho de um humano: primeiro o GET da página inicial, que te dá os cookies e o token embutido, depois o POST reusando tudo.

```python
s = requests.Session(impersonate="chrome")

# 1) GET inicial: a sessão guarda os cookies, e o HTML traz o token de estado
home = s.get("https://exemplo.com/busca")
token = BeautifulSoup(home.text, "html.parser").select_one("input[name=_token]")["value"]

# 2) POST reusando cookies (a sessão cuida) + o token + um Referer coerente
r = s.post("https://exemplo.com/busca",
           data={"_token": token, "q": "termo"},
           headers={"Referer": "https://exemplo.com/busca"})
```

Se o token não está embutido no HTML, mas é gerado por JavaScript no navegador, o GET não te entrega ele pronto, e aí você cai no caso de precisar executar JS.

## Quando o navegador é inevitável: o disfarce

Às vezes não tem escapatória e você vai pro navegador automatizado. Só que ele também tem marcas que o entregam: uma propriedade que anuncia "estou sob automação", uma lista de plugins vazia, a ausência de objetos que um navegador comum sempre tem. Scripts anti-bot leem exatamente isso. A resposta é injetar, antes de a página carregar seus scripts, um trecho que sobrescreve essas marcas pra você parecer um navegador comum.

```python
# injeta o disfarce ANTES de a página rodar o JavaScript dela
page.add_init_script("""
  Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
  Object.defineProperty(navigator, 'plugins',   { get: () => [1, 2, 3] });
  window.chrome = { runtime: {} };
""")
page.goto("https://exemplo.com")
```

E aqui mora uma armadilha contraintuitiva: alguns desafios procuram justamente o disfarce, detectando quem está tentando se esconder. Pode ser que, num alvo assim, ligar o disfarce bloqueie e desligá-lo passe, o oposto do que a intuição manda. Trate isso como uma chave que você liga e desliga por alvo, testando, nunca como um "deixa sempre ligado".

## A história precisa fechar

Repare no fio que costura o capítulo: o servidor raramente te barra por uma coisa só. Ele te barra pela incoerência. Handshake de navegador, cabeçalhos de navegador, os cookies do fluxo, o IP de onde você sai, o comportamento na página: tudo isso conta a mesma história, e quando uma peça destoa, o porteiro percebe. O IP, aliás, carrega reputação própria: um endereço de datacenter já chega marcado como provável robô, um residencial passa por acesso comum. Quando é o seu IP que destoa, seja por estar marcado, seja por sair de um país que não bate com o idioma que você declara, a saída é roteá-lo por um proxy, que faz a requisição sair de outro endereço. Não é item obrigatório: você recorre a ele só quando o IP é o que está te entregando. Passar por essa camada é, no fundo, contar uma história consistente do primeiro handshake até o clique no botão de buscar.

Tem uma porta, porém, que história coerente nenhuma abre sozinha: o captcha. Ela te para na cara e pede que você prove, ali, que é humano.
