# Conteúdo &amp; Escala

*Extrair o dado de um HTML hostil, e aguentar fazer isso mil vezes sem ser derrubado.*

Você passou pela porta e o servidor te entregou o HTML, mas HTML cru ainda não é o dado estruturado que você quer. Este capítulo tem duas metades. A primeira é extrair o dado de um jeito que não quebre no próximo deploy do site. A segunda é o que acontece quando você deixa de fazer isso uma vez e passa a fazer mil: a escala traz muros que uma requisição sozinha nunca mostra.

## Extrair: ancore no que é estável

O erro mais comum na extração é prender o seletor em algo que o site troca a toda hora. O exemplo clássico são ids e classes gerados dinamicamente: `field_a8f3c2` hoje, `field_19bd0e` no próximo deploy. Fixar o seletor nesse id é garantir que o parser quebre, e quebre em silêncio.

A regra é ancorar no que não muda, e há um cardápio de âncoras conforme o que o HTML te dá, da mais limpa à mais teimosa:

```python
import re

# RUIM: preso a um id/classe volátil, quebra no próximo deploy
soup.select_one("#form_a8f3c2_numero")

# (a) sufixo estável do id: o prefixo muda, o fim não
soup.select_one("[id$='_numero']")

# (b) pelo rótulo de texto: acha o <label> e pega o valor ao lado
label = soup.find("label", string=re.compile("Número"))
numero = label.find_next(class_="value").get_text(strip=True)

# (c) pelo rótulo, subindo ao container: rótulo -> bloco do campo -> valor
campo = label.find_parent(class_="campo")
numero = campo.select_one(".valor").get_text(strip=True)

# (d) âncora de texto fora de <label> (um <strong>/<b>) + vizinho
ancora = soup.find("strong", string=re.compile("Valor", re.I))
valor = ancora.find_next("span").get_text(strip=True)

# (e) pelo FORMATO do valor, quando nada na estrutura é confiável
valor = re.search(r"R\$\s?[\d.,]+", soup.get_text(" "))

# (f) valor preso só num JS/atributo: regex no HTML cru
m = re.search(r"abrirDetalhe\('(\d+)'", html)   # id que só existe no onclick
item_id = m.group(1) if m else None
```

Use o primeiro que funcionar; cada degrau abaixo é mais frágil de manter. A regex pelo conteúdo é o que segura quando o site randomiza até o rótulo visível.

## Quando o dado vem por JavaScript

Se o conteúdo é montado por script (você viu isso lá no reconhecimento), tem dois caminhos. O melhor é achar a requisição que alimenta o DOM e consumir ela direto: quase sempre é um JSON, que muda menos que HTML e dispensa o navegador. Só quando não dá é que você renderiza, e se o site só monta o conteúdo por JavaScript sem checar quem acessa, o navegador headless dá conta e é bem mais rápido que abrir uma janela visível. Aí o detalhe que pega todo mundo é esperar o conteúdo aparecer, não a resposta da rede. Um DOM ainda vazio é idêntico à página inicial; espere o elemento que você quer existir.

```python
# preferível: consumir a API que alimenta o DOM (JSON, mais estável que HTML)
dados = requests.get("https://exemplo.com/api/resultados",
                     params={"q": "termo"}).json()

# se precisar do navegador: espere o CONTEÚDO, não só a resposta
page.wait_for_selector("[id$='tabela'] tr", timeout=6000)
```

## Parsing que dobra em vez de quebrar

HTML do mundo real é irregular: campos faltam em alguns registros, tabelas vêm com colunas em ordem diferente, um item no meio do lote chega malformado. Um parser rígido explode no primeiro desvio e leva o lote inteiro junto. Um parser bom degrada: isola cada item, tolera ausência, e nunca confia em posição fixa.

```python
# ancore no container estável (a tabela) e itere as linhas
tabela = soup.select_one("table[id$='_resultados']")   # sufixo, não id volátil
cabecalhos = tabela.select_one("tr").select("th")
linhas = tabela.select("tr")[1:]                        # pula o cabeçalho

resultados = []
for linha in linhas:
    try:
        resultados.append(extrair(linha))
    except Exception as e:
        log.warning("item ignorado: %s", e)   # 1 item ruim != lote perdido

# dentro de extrair(linha): a coluna sai do CABEÇALHO, não de índice fixo
col = {th.get_text(strip=True): i for i, th in enumerate(cabecalhos)}
celulas = linha.select("td")
data = celulas[col["Data/Hora"]].get_text(strip=True)
```

Tolerância demais tem um custo escondido: se *todos* os itens passarem a falhar, o `try/except` engole o sintoma e você não percebe que parou de extrair.

## Escala: a concorrência acelera e revela o muro

Agora a segunda metade. Fazer mil vezes não é só "repetir num loop": a escala muda o comportamento do alvo. Servidores detectam padrões de requisição previsíveis, e muitos bloqueios (rate limit, WAF) só aparecem sob carga. Por isso a concorrência tem um papel duplo: ela acelera a coleta e revela o muro, de preferência no seu teste, não em produção.

Na prática, você divide a entrada em N workers, cada um com sua própria sessão isolada, e devolve os resultados por uma queue. A sessão tem que ser por worker porque cookies, token de estado e id de sessão pertencem a um fluxo só; dois workers no mesmo cliente embaralhariam o estado um do outro e dariam erro intermitente impossível de depurar. Trave só os contadores compartilhados, nunca o caminho dos dados.

```python
import threading, queue

q = queue.Queue()

def worker(sublote):
    cliente = nova_sessao()             # sessão/contexto isolado por thread
    for doc in sublote:
        q.put(processar(doc, cliente))

# para navegador, o equivalente barato é 1 processo com N contextos isolados,
# em vez de abrir N navegadores (que custa memória e te denuncia pelo volume).
```

Concorrência demais vira um auto-ataque de negação de serviço: você derruba o alvo ou acelera o próprio bloqueio. Existe um ponto ótimo por site; ache empiricamente, rodando um lote pequeno em vários níveis e ficando no maior nível antes de a taxa de erro disparar.

```python
# achar o ponto ótimo: rode o MESMO lote pequeno em vários níveis
# e fique no maior nível antes de a taxa de erro disparar
import concurrent.futures as cf

def taxa_de_erro(n):
    with cf.ThreadPoolExecutor(max_workers=n) as ex:
        res = list(ex.map(processar, lote_amostra))
    return sum(r is None for r in res) / len(res)

for n in (2, 4, 8, 16):
    print(n, taxa_de_erro(n))     # sobe até o erro deixar de ser ~0
```

## Falhar com elegância: retry, backoff e o circuit breaker

Sob escala, falhas deixam de ser exceção e viram rotina, e você precisa de três defesas. Retry com backoff (1s, 2s, 4s) para o que é transitório. Rotação de IP, trocando o proxy de saída, quando vêm muitos timeouts seguidos (sinal de bloqueio progressivo). E um circuit breaker: se acontecem N falhas *consecutivas* sem nenhum sucesso no meio, o problema é sistêmico (o site caiu, mudou, ou te bloqueou de vez) e insistir só queima a queue, e, se há captcha, créditos reais. Melhor abortar e avisar uma vez.

```python
import time, threading

def com_retry(fn, tentativas=3):
    for i in range(tentativas):
        try:
            return fn()
        except ERROS_DE_REDE:
            if i == tentativas - 1:
                raise
            time.sleep(2 ** i)          # 1s, 2s, 4s

# circuit breaker: conta falhas CONSECUTIVAS entre os workers; um sucesso zera
_lock = threading.Lock()
falhas = 0

def pode_continuar(ok):
    global falhas
    with _lock:                         # workers concorrentes mexem no mesmo contador
        falhas = 0 if ok else falhas + 1
        return falhas < LIMITE          # False = N falhas seguidas, aborte o lote
```

Backoff cego contra um bloqueio definitivo só adia o inevitável. O circuit breaker é justamente o reconhecimento de que, passado um limite, insistir é desperdício: a resposta certa é parar e investigar.

Vale um olhar na segunda defesa, a rotação de IP, que tem duas formas e um pré-requisito. O pré-requisito é a reputação do endereço: sob escala, um IP de datacenter apanha rápido, enquanto um proxy residencial, com cara de acesso doméstico, aguenta muito mais antes de ser barrado. As duas formas são a rotação manual, em que você mantém uma lista de proxies e passa para o próximo quando detecta bloqueio, e o proxy rotativo, um único endereço que já entrega um IP de saída diferente a cada requisição, sem você gerenciar a troca. Nenhum é obrigatório: você recorre a eles só quando o próprio IP virou o gargalo.

```python
import itertools, requests

# rotação MANUAL: uma lista de proxies residenciais, troca quando apanha
POOL = ["http://user:senha@host1:porta", "http://user:senha@host2:porta"]
proxies = itertools.cycle(POOL)

def nova_sessao():
    proxy = next(proxies)                 # próximo IP da queue
    s = requests.Session()
    s.proxies = {"http": proxy, "https": proxy}
    return s

# proxy ROTATIVO: a URL é fixa; o serviço troca o IP de saída a cada request
GATEWAY = "http://user:senha@gateway:porta"
s = requests.Session()
s.proxies = {"http": GATEWAY, "https": GATEWAY}
```

## Resumo

Extrair bem é ancorar no estável (rótulo, sufixo, formato) e fazer o parser dobrar em vez de quebrar. Escalar bem é usar a concorrência para expor o bloqueio cedo, isolar a sessão por worker, e ter retry, rotação de IP e circuit breaker para parar com elegância quando o muro aparece.
