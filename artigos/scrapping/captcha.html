# Captcha

*A porta que coerência nenhuma abre sozinha, e como atravessá-la sem queimar dinheiro à toa.*

Captcha assusta quem está começando, mas dá pra desarmar a expectativa logo: na prática, você quase nunca "resolve" um captcha sozinho. Você terceiriza a resolução para um serviço especializado, recebe um token válido de volta, e injeta esse token onde o site espera. O trabalho de verdade não é resolver. É detectar qual captcha é, descobrir como entregá-lo certo ao serviço, e saber a hora de não insistir.

## Antes de tudo: não resolva o que dá pra evitar

Resolver captcha custa dinheiro (o serviço cobra por resolução) e tempo (segundos por desafio). Então a primeira pergunta nunca é "como resolvo?", e sim "preciso mesmo passar por aqui?". Existe uma rota da API que não exige o captcha? Um fluxo alternativo no site? Uma página de resultado que não o dispara? Procure o desvio antes de pagar o pedágio. O solver é a última coisa que você adiciona, não a primeira.

## Detectar qual captcha é, e se está mesmo ligado

Cada tipo de captcha fala uma língua diferente, então o primeiro passo é identificar com qual você está lidando. A assinatura de cada um vive no HTML:

```python
soup = BeautifulSoup(html, "html.parser")
h = html.lower()

# cada captcha deixa uma marca própria no HTML; detecte por ela
if "cf-turnstile" in h or "challenges.cloudflare.com/turnstile" in h:
    tipo = "turnstile"          # Cloudflare Turnstile (token vai no cf-turnstile-response)
elif "turing.captcha.qcloud.com" in h or "new tencentcaptcha" in h:
    tipo = "tencent"            # Tencent Captcha: o id é o appId do new TencentCaptcha(...)
elif "hcaptcha.com" in h or "h-captcha" in h:
    tipo = "hcaptcha"           # hCaptcha (token no h-captcha-response)
elif "recaptcha/api.js" in h or "g-recaptcha" in h:
    tipo = "recaptcha_v2"       # reCAPTCHA v2 (checkbox ou invisível)
elif soup.select_one("img[src^='data:image']") or soup.select_one("img[src*='captcha']"):
    tipo = "imagem"             # imagem estática embutida: baixe os bytes e leia
else:
    tipo = "nenhum"
```

Aí vem o tropeço que derruba muita gente: o captcha estar carregado no HTML não significa que ele está ativo. Alguns sites implementam um captcha mas o deixam desativado; outros trocaram de captcha e nunca removeram a implementação antiga, que segue no HTML sem disparar. Antes de gastar uma resolução, confirme qual desafio dispara de fato: olhe o que o botão de buscar realmente chama no `onclick` e qual função de captcha é de fato acionada. Resolver o captcha errado é dinheiro no lixo.

## Resolver: o fluxo genérico

O padrão é sempre o mesmo, qualquer que seja o tipo: você manda ao serviço os parâmetros do desafio (o identificador do captcha e a URL, ou os bytes da imagem), espera o token, e injeta esse token no campo escondido ou no parâmetro que o site espera.

```python
from twocaptcha import TwoCaptcha
solver = TwoCaptcha("SUA_API_KEY")

# sitekey/app_id vêm da extração do HTML (mostrada adiante)
# cada tipo tem seu método; todos devolvem o token em ["code"]
token = solver.turnstile(sitekey=sitekey, url=url)["code"]               # Cloudflare Turnstile
token = solver.recaptcha(sitekey=sitekey, url=url, invisible=1)["code"]  # reCAPTCHA v2 (invisível: invisible=1)
token = solver.hcaptcha(sitekey=sitekey, url=url)["code"]                # hCaptcha
token = solver.tencent(app_id=app_id, url=url,                          # Tencent: id = appId
                       captcha_script="https://.../TCaptcha-global.js")["code"]  # script não-padrão obrigatório, senão UNSOLVABLE
texto = solver.normal("captcha.png")["code"]                            # imagem estática

# o token/texto entra no POST como se você tivesse resolvido na tela
```

## Resolveu uma vez? Reuse a sessão validada

Resolver custa, então um token resolvido tem que render. Muitos sites validam o captcha uma vez e, daí em diante, confiam na sessão (no cookie) por um tempo ou por um número de consultas. Quem resolve o captcha a cada documento paga solve à toa. O padrão que economiza é resolver uma vez, marcar a sessão como validada, e seguir consultando com ela; só quando o site repõe o desafio (a sessão expirou ou foi derrubada) é que você resolve de novo.

```python
def garantir_sessao(sessao):
    if getattr(sessao, "_validada", False):
        return                                 # já validou: reusa o cookie
    token = resolver_captcha(...)              # gasta 1 solve
    sessao.post(URL_VALIDAR, data={"token": token})
    sessao._validada = True

def consultar(sessao, doc):
    garantir_sessao(sessao)
    r = sessao.post(URL_BUSCA, data={"doc": doc})
    if "cf-turnstile" in r.text:               # o site repôs o desafio: revalida
        sessao._validada = False
        garantir_sessao(sessao)
        r = sessao.post(URL_BUSCA, data={"doc": doc})
    return r
```

Quanto mais documentos por sessão validada, menor o custo por resultado. O cuidado é perceber a reapresentação do desafio: se você não nota que a sessão caiu, passa a mandar consultas que o site recusa achando que está tudo certo.

## Captcha de imagem estática: às vezes nem precisa de serviço

Para o captcha mais simples, aquela imagem estática com letras ou números distorcidos, você nem sempre precisa de um serviço pago. Dá pra resolver localmente com visão computacional: um modelo de OCR roda na sua própria máquina, lê a imagem e devolve o texto. É barato (sem custo por resolução) e rápido (sem a ida e volta a um serviço externo), e pra um volume grande de um mesmo captcha de imagem compensa muito.

```python
# captcha de imagem simples resolvido localmente, sem serviço pago
import easyocr

reader = easyocr.Reader(["en"])
texto = "".join(reader.readtext("captcha.png", detail=0))
```

Vale só pros simples. Captcha de widget, "selecione as imagens com…", ou o que avalia comportamento não caem por OCR. Pra esses, é serviço (ou pior, o caso extremo lá embaixo).

## Captcha de proof-of-work: você resolve sem serviço e sem navegador

Nem todo captcha pede um humano. Existe uma família que, em vez de "selecione as imagens" ou "arraste a peça", manda o seu cliente provar que gastou trabalho de processador: o servidor envia um sal, um hash-alvo e um teto, e cabe a você achar o número que, junto do sal, gera aquele hash. É proof-of-work, e não há desafio humano para terceirizar. Você reproduz na sua máquina o mesmo laço que o JavaScript do site faria.

```python
import hashlib, base64, json

# captcha de proof-of-work (ALTCHA e parecidos): o desafio traz o sal,
# o hash-alvo e o teto de busca; ache o n cujo sha256(sal+n) bate com o alvo
desafio = sessao.get("https://exemplo.com/captcha/desafio").json()
sal, alvo, teto = desafio["salt"], desafio["challenge"], desafio["maxnumber"]

prova = None
for n in range(teto + 1):
    if hashlib.sha256(f"{sal}{n}".encode()).hexdigest() == alvo:
        solucao = {"algorithm": desafio["algorithm"], "challenge": alvo,
                   "number": n, "salt": sal, "signature": desafio["signature"]}
        prova = base64.b64encode(json.dumps(solucao).encode()).decode()
        break
# 'prova' entra no POST onde o site espera, como se o widget tivesse resolvido
```

O custo é o do laço: teto pequeno resolve em milissegundos, e como roda local não há ida e volta a serviço nem gasto por resolução. O teto regula a dificuldade: quanto maior, mais processamento o servidor te obriga a gastar por requisição.

## A regra de ouro: não declare "irresolvível" cedo demais

Essa é a lição que mais economiza tempo e dinheiro. Um captcha pode voltar erro atrás de erro e parecer impossível quando a causa não é o desafio, e sim um parâmetro que falta na chamada ao serviço. É comum em sites que carregam o captcha por um script não-padrão ou em domínio próprio: o serviço de resolução precisa ser avisado disso para resolver o desafio certo. Com o parâmetro correto, o mesmo captcha "irresolvível" resolve de primeira.

A lição: muito captcha "irresolvível" é só um parâmetro faltando. Antes de desistir, leia a documentação do serviço para aquele tipo, confirme se a biblioteca tem o método, procure problemas já relatados por outras pessoas (o mesmo desafio provavelmente já travou alguém), e esgote os parâmetros opcionais. Testar costuma ser de graça quando o resultado é "não consegui resolver", então teste à vontade antes de cravar que é impossível.

## Leia o identificador, não o fixe

O identificador do captcha pode mudar entre deploys do site. Se você o fixou no código, na próxima rotação você passa a pedir a resolução do captcha errado, e falha em silêncio. Extraia o identificador do próprio HTML, em tempo de execução, sempre. E note que ele não vive sempre no mesmo lugar: a maioria dos widgets usa o `data-sitekey`, mas alguns guardam o id no argumento de um construtor JavaScript.

```python
import re
soup = BeautifulSoup(html, "html.parser")

# a maioria dos widgets expõe o id no data-sitekey
# (reCAPTCHA, hCaptcha e o Turnstile do Cloudflare seguem esse padrão)
el = soup.select_one("[data-sitekey]")
sitekey = el["data-sitekey"] if el else None

# o Tencent NÃO usa data-sitekey: o id (appId) vem no argumento do construtor
m = re.search(r"new TencentCaptcha\(\s*['\"]([^'\"]+)['\"]", html)
app_id = m.group(1) if m else None
```

## O proxy e o IP de quem resolve

Um detalhe que pega quem usa proxy: muitos sites cruzam o IP que resolveu o captcha com o IP que enviou a requisição. Se o desafio foi resolvido de um lugar (o IP do serviço de resolução, por exemplo) e o formulário sai de outro (o seu proxy), esse descasamento é um sinal claro de automação, e o site rejeita, mesmo com o token "válido".

A regra: o captcha precisa ser resolvido do mesmo IP, ou ao menos da mesma reputação e geografia, de onde a requisição parte. É por isso que os serviços de resolução aceitam um proxy: pra resolver o desafio saindo do *seu* IP. Se você usa proxy na coleta, use o mesmo proxy na resolução.

```python
# resolve o captcha SAINDO do seu proxy, pro IP bater com o da requisição
token = solver.turnstile(sitekey=sitekey, url=url,
                         proxy={"type": "HTTP", "uri": "user:senha@host:porta"})["code"]
```

## O captcha invisível por score: deixe o navegador gerar o token

Há um tipo de captcha invisível que não te entrega desafio nenhum para resolver: ele observa a sessão em segundo plano e devolve um score de confiança em vez de um sim ou não. Não tem imagem, não tem widget para clicar, e não tem token para pedir a um serviço, porque o token que vale é o que a própria página gera sozinha, de forma contínua. Um token injetado de fora costuma pontuar mal e ser recusado. O que funciona é deixar um navegador de verdade gerar o token e esperar ele aparecer antes de enviar o formulário. E tem que ser um navegador visível (headed), porque o modo headless costuma pontuar baixo e a validação falha.

```python
# captcha invisível por score (reCAPTCHA v3 e afins): não há nada a "resolver".
# A página enche um campo escondido com o token, de forma assíncrona; rode um
# navegador REAL e espere o campo encher antes de enviar.
page.goto(url)
page.fill("#campo_documento", doc)
page.wait_for_function(
    "() => { const e = document.getElementById('token_resposta');"
    " return e && e.value && e.value.length > 50; }",
    timeout=30000,
)
page.click("#botao_buscar")   # enviar antes do token: campo vazio, e o site recusa
```

O detalhe que pega é o tempo: o campo do token só enche depois que a página carrega, então enviar cedo manda um campo vazio e o site recusa sem dizer por quê. Espere o token existir no campo, não só a página ter carregado.

## O caso extremo: quando nem o captcha resolvido basta

Tem um degrau acima desse. Existe uma classe de sites realmente blindados onde nem o navegador de verdade basta: o score pesa também o seu comportamento e, mesmo com o token gerado na própria página, o site devolve `false` e te bloqueia. Mudar cabeçalhos, locale, stealth, nada move o ponteiro, porque o muro não é o desafio: é "isto não parece uma pessoa de verdade num navegador de verdade".

Contra esse tipo de barreira, injetar um token resolvido de fora não soma confiança nenhuma. O que ajuda é resolver o captcha por interação real dentro do próprio navegador, com uma extensão como a do NopeCHA: a resolução acontece como a de um usuário comum e conta pontos no score, em vez de parecer um token vindo de fora. Some a isso comportamento de gente de verdade, o mouse se movendo até os botões e cliques reais, e o score sobe o suficiente para passar. É lento e quebradiço: depende da posição dos elementos na tela, então um ajuste de layout já o derruba.

E continua valendo a regra que costura este capítulo inteiro: resolver o captcha não conserta uma sessão que o servidor já achou suspeita. Se você apanha de captcha porque a sua conexão parece de robô, o token só adia o bloqueio, a causa está uma camada antes.

## Resumo

Captcha é mais mecânico que assustador: identifique o tipo, confirme que está ligado, e resolva pelo caminho que ele pede (serviço, máquina local, ou navegador real para o invisível por score). Antes de cravar "impossível", cheque os parâmetros opcionais e o identificador lido em runtime.</script>
