# Conexão &amp; Sessão

*O muro antes do conteúdo: fazer o servidor te aceitar como um cliente legítimo.*

Antes de entregar uma única linha de HTML, o servidor te avalia: como você abriu a conexão, o que seus cabeçalhos dizem, se você trouxe os cookies certos, se você seguiu o caminho. Passar por cada uma dessas portas é o assunto deste capítulo, e a lição que costura tudo é uma só: o que te derruba raramente é uma peça sozinha, e sim a incoerência entre elas.

## O porteiro invisível: a assinatura de TLS

Esse é o muro que mais gente bate sem entender. Você manda uma requisição, recebe um `403`, e conclui que precisa de navegador. Mas então abre o site no navegador, na mesma rede, e funciona. Mesma URL, cabeçalhos parecidos. O que muda?

O que muda acontece antes do HTTP. Para falar HTTPS, cliente e servidor primeiro negociam a conexão criptografada, o *handshake* de TLS, e essa negociação tem um fingerprint: a combinação de versões, cifras e extensões que o seu cliente oferece, o que chamam de JA3/JA4. Cada biblioteca tem um fingerprint próprio e conhecido, e alguns sistemas de defesa barram tudo que não tem cara de navegador real antes mesmo de olhar o que você pediu.

A saída é usar um cliente HTTP que imita o handshake de um navegador.

```python
# um cliente HTTP que assume o fingerprint TLS de um navegador real
from curl_cffi import requests

r = requests.get("https://exemplo.com", impersonate="chrome")
print(r.status_code)   # passa onde o cliente padrão tomava 403
```
```javascript
// um cliente HTTP que assume o fingerprint TLS de um navegador real
const { gotScraping } = require("got-scraping");

const r = await gotScraping.get("https://exemplo.com");
console.log(r.statusCode);   // passa onde o cliente padrão tomava 403
```

Isso vence a checagem do handshake, mas não um desafio que exige executar JavaScript. Se, depois de passar no TLS, ainda vem uma página de "verificando seu navegador", o problema é outro e você vai precisar do navegador.

## A identidade que você declara: os cabeçalhos

Passado o handshake, vêm os cabeçalhos, e o servidor lê todos, inclusive a ordem em que chegam, que também é parte do fingerprint. Um dicionário montado à mão sai numa ordem que nenhum navegador usa, e por isso o mesmo cliente que imita o handshake reproduz aqui o conjunto e a ordem certos. A você cabe completar com os que mudam por requisição (o `Accept` conforme o recurso, o `Referer`, o `X-Requested-With` numa XHR) e manter tudo coerente com o navegador que você diz ser.

```python
# o cliente que imita o navegador já manda o UA e a ordem dos cabeçalhos;
# você completa com os que mudam por requisição
headers = {
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
    "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
    "Accept-Encoding": "gzip, deflate, br",
    "Upgrade-Insecure-Requests": "1",
    "Sec-Fetch-Dest": "document",
    "Sec-Fetch-Mode": "navigate",
    "Sec-Fetch-Site": "same-origin",
    "Referer": "https://exemplo.com/",
}
r = requests.get(url, headers=headers, impersonate="chrome")

# numa chamada XHR, o Accept e o X-Requested-With mudam:
xhr = {"Accept": "application/json, text/javascript, */*; q=0.01",
       "X-Requested-With": "XMLHttpRequest", "Referer": "https://exemplo.com/busca"}
```
```javascript
// o cliente que imita o navegador já manda o UA e a ordem dos cabeçalhos;
// você completa com os que mudam por requisição
const headers = {
  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
  "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
  "Accept-Encoding": "gzip, deflate, br",
  "Upgrade-Insecure-Requests": "1",
  "Sec-Fetch-Dest": "document",
  "Sec-Fetch-Mode": "navigate",
  "Sec-Fetch-Site": "same-origin",
  "Referer": "https://exemplo.com/",
};
const r = await gotScraping.get(url, { headers });

// numa chamada XHR, o Accept e o X-Requested-With mudam:
const xhr = { "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest", "Referer": "https://exemplo.com/busca" };
```

Um detalhe que poupa dor de cabeça: centralize esses valores num lugar só. `User-Agent` copiado em dez arquivos vira dez versões diferentes com o tempo, e basta uma destoar pra você ter um bug que só aparece "às vezes".

## O caminho e o estado: cookies, tokens e a ordem das coisas

Muitos sites não aceitam um POST direto no endereço do resultado. Eles exigem que você tenha passado pelo caminho: um cookie que só é setado na página inicial, um token de estado escondido no HTML do formulário, um identificador de sessão, um `Referer` que faça sentido. Pular etapas devolve um formulário vazio ou um erro educado, e você perde horas achando que o problema é outro. A solução é reproduzir o caminho de um humano: o GET da página inicial te dá os cookies e os campos escondidos do formulário, e o POST reenvia todos eles, não só o que você acha que importa.

```python
s = requests.Session(impersonate="chrome")

# 1) GET inicial: a sessão guarda os cookies (um id de sessão tipo jsessionid)
home = s.get("https://exemplo.com/busca")
soup = BeautifulSoup(home.text, "html.parser")

# 2) colha TODOS os hidden do form (_csrf, javax.faces.ViewState, etc.),
#    não só "o token": eles costumam ser exigidos juntos no POST
form = {i["name"]: i.get("value", "") for i in soup.select("form input[name]")}
form["q"] = "termo"                       # seus parâmetros por cima

# 3) POST reusando cookies (a sessão cuida) + os hidden + Referer coerente
r = s.post("https://exemplo.com/busca", data=form,
           headers={"Referer": "https://exemplo.com/busca"})
```
```javascript
const { CookieJar } = require("tough-cookie");
const cheerio = require("cheerio");
const cookieJar = new CookieJar();   // a sessão: guarda os cookies entre requests

// 1) GET inicial: o cookieJar guarda os cookies (um id de sessão tipo jsessionid)
const home = await gotScraping.get("https://exemplo.com/busca", { cookieJar });
const $ = cheerio.load(home.body);

// 2) colha TODOS os hidden do form (_csrf, javax.faces.ViewState, etc.),
//    não só "o token": eles costumam ser exigidos juntos no POST
const form = {};
$("form input[name]").each((_, el) => { form[el.attribs.name] = el.attribs.value || ""; });
form.q = "termo";                          // seus parâmetros por cima

// 3) POST reusando cookies (o jar cuida) + os hidden + Referer coerente
const r = await gotScraping.post("https://exemplo.com/busca", {
  cookieJar, form, headers: { "Referer": "https://exemplo.com/busca" },
});
```

Onde o estado mora varia: um campo escondido de name fixo, um campo gerado pelo framework, um cookie que a sessão já guarda, ou um valor que só aparece depois de uma XHR intermediária. Por isso reenviar o formulário inteiro é mais seguro que caçar um campo só. E se o valor é gerado por JavaScript no navegador, o GET não te entrega ele pronto, e aí você cai no caso de precisar executar JS.

## Quando o navegador é inevitável: o disfarce

Às vezes não tem escapatória e você vai pro navegador automatizado, e ele carrega marcas que o entregam. A mais conhecida é a propriedade que anuncia "estou sob automação", mas a superfície é bem maior: a lista de idiomas, o fornecedor da placa de vídeo via WebGL, o fuso horário, os plugins, a resposta a consultas de permissão. A resposta é injetar, antes de a página rodar os scripts dela, um trecho que normaliza essas marcas para as de um navegador comum, e mantê-las coerentes entre si: o idioma e o fuso têm que bater com o IP de onde você sai, e o user agent do script com o dos cabeçalhos e do handshake.

```python
# injeta o disfarce ANTES de a página rodar o JavaScript dela
page.add_init_script("""
  Object.defineProperty(navigator, 'webdriver',  { get: () => false });
  Object.defineProperty(navigator, 'languages',  { get: () => ['pt-BR','pt','en-US'] });
  window.chrome = window.chrome || { runtime: {} };
  // plugins plausíveis, não uma lista vazia
  Object.defineProperty(navigator, 'plugins', { get: () => [{ name: 'Chrome PDF Plugin' }] });
  // WebGL: fornecedor/renderer de uma GPU real, não o de software headless
  const gp = WebGLRenderingContext.prototype.getParameter;
  WebGLRenderingContext.prototype.getParameter = function (p) {
    if (p === 0x9245) return 'Intel Inc.';               // UNMASKED_VENDOR
    if (p === 0x9246) return 'Intel Iris OpenGL Engine';  // UNMASKED_RENDERER
    return gp.call(this, p);
  };
  // fuso coerente com o IP de saída
  const ro = Intl.DateTimeFormat.prototype.resolvedOptions;
  Intl.DateTimeFormat.prototype.resolvedOptions = function () {
    const r = ro.call(this); r.timeZone = 'America/Sao_Paulo'; return r;
  };
""")
page.goto("https://exemplo.com")
```
```javascript
// injeta o disfarce ANTES de a página rodar o JavaScript dela
await page.addInitScript(() => {
  Object.defineProperty(navigator, 'webdriver',  { get: () => false });
  Object.defineProperty(navigator, 'languages',  { get: () => ['pt-BR','pt','en-US'] });
  window.chrome = window.chrome || { runtime: {} };
  // plugins plausíveis, não uma lista vazia
  Object.defineProperty(navigator, 'plugins', { get: () => [{ name: 'Chrome PDF Plugin' }] });
  // WebGL: fornecedor/renderer de uma GPU real, não o de software headless
  const gp = WebGLRenderingContext.prototype.getParameter;
  WebGLRenderingContext.prototype.getParameter = function (p) {
    if (p === 0x9245) return 'Intel Inc.';               // UNMASKED_VENDOR
    if (p === 0x9246) return 'Intel Iris OpenGL Engine';  // UNMASKED_RENDERER
    return gp.call(this, p);
  };
  // fuso coerente com o IP de saída
  const ro = Intl.DateTimeFormat.prototype.resolvedOptions;
  Intl.DateTimeFormat.prototype.resolvedOptions = function () {
    const r = ro.call(this); r.timeZone = 'America/Sao_Paulo'; return r;
  };
});
await page.goto("https://exemplo.com");
```

Manter esse script à mão é uma corrida perdida, porque cada checagem nova pede um remendo; na prática você usa um pacote de stealth pronto, mantido por quem persegue essas detecções. E aqui mora uma armadilha contraintuitiva: alguns desafios procuram justamente o disfarce, detectando as inconsistências que ele cria. Pode ser que, num alvo assim, ligar o disfarce bloqueie e desligá-lo passe, o oposto do que a intuição manda. Trate isso como uma chave que você liga e desliga por alvo, testando, nunca como um "deixa sempre ligado".

## Resumo

O servidor te barra pela incoerência, não por uma peça só: handshake de TLS, cabeçalhos coerentes e na ordem certa, os cookies e campos do fluxo, o disfarce do navegador e o IP de saída têm que contar a mesma história. Quando uma destoa, o porteiro percebe.
