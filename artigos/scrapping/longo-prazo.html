# Scraping a longo prazo

*O scraper que funciona hoje vai quebrar, e o pior é que não vai avisar. Este capítulo é sobre tornar a falha barulhenta.*

Fazer um scraper funcionar é uma coisa; mantê-lo funcionando é outra. Este capítulo é sobre detectar quando o alvo muda e consertar o parser de graça, sem refazer a coleta inteira.

## O inimigo real: a falha silenciosa

Um scraper raramente morre com um erro limpo. O que acontece é pior. O site muda o nome de um campo, o seu seletor passa a achar nada, o parser tolerante (aquele que você fez dobrar em vez de quebrar) engole o vazio, a gravação salva um registro em branco, e tudo continua "rodando". Nenhum erro. Nenhum alarme. Você descobre semanas depois, com a base já cheia de lixo.

## Detecção proativa: a assinatura versionada

A primeira defesa é barata e preventiva. Com um GET por alvo, você extrai uma "assinatura" do que é estável entre uma visita e outra (os nomes dos campos do formulário, a presença e o estado do captcha, o identificador dele) e compara com um baseline guardado no versionamento. Roda isso periodicamente, num cron. Quando algo muda, vira um diff que você revisa: ou é uma mudança legítima, e você atualiza o baseline, ou é uma regressão, e você conserta antes de a produção gravar lixo.

```python
def assinatura(html):
    soup = BeautifulSoup(html, "html.parser")
    return {
        "campos":  sorted(i.get("name") for i in soup.select("input[name]")),
        "captcha": detectar_tipo(html),
        # id do widget (data-sitekey no padrão reCAPTCHA/hCaptcha/Turnstile)
        "sitekey": (soup.select_one("[data-sitekey]") or {}).get("data-sitekey"),
    }

nova = assinatura(requests.get(URL).text)
if nova != json.load(open("baseline.json")):
    alertar(nova)   # revise ANTES de a produção rodar em cima de uma mudança
```

Tem um detalhe que evita o falso positivo: se os ids do formulário são randômicos, normalize-os antes de comparar, trocando o sufixo volátil por um placeholder. Sem isso, todo deploy do site vira um "mudou" falso, e você aprende a ignorar o alarme, que é exatamente como alarmes morrem.

## Detecção comportamental: o gabarito

A assinatura pega "a estrutura mudou". Mas o parser pode parar de extrair com a estrutura idêntica: um seletor que casava deixou de casar por um detalhe sutil. Só rodar o scrape de verdade pega isso. Para isso serve um gabarito versionado por alvo: uma entrada de teste conhecida-boa, o número mínimo de resultados que ela deve devolver, e os campos que nunca podem vir vazios. Você roda o scrape real contra o gabarito e afirma as duas coisas.

```python
gabarito = {"entrada": "<entrada de teste>", "min_results": 1,
            "campos_obrig": ["numero", "data", "partes"]}

res = scrape(gabarito["entrada"])
assert len(res) >= gabarito["min_results"]
for campo in gabarito["campos_obrig"]:
    assert any(r.get(campo) for r in res), f"{campo} sempre vazio: o seletor quebrou"
```

Derive o gabarito de um run real, pegando a interseção dos campos que vieram preenchidos em *todos* os resultados, em vez de escrever à mão. Assim ele reflete o que o alvo realmente entrega, e não a sua suposição do que deveria entregar.

Presença não é tudo: um campo pode vir cheio e errado. É o caso clássico do parser que casa o seletor vizinho e traz, sem reclamar, o valor de outro campo. Por isso o gabarito ganha uma segunda camada, a forma do valor. Em vez de só "não pode estar vazio", você afirma que a data parseia como data, que o número cai numa faixa sã, que o identificador bate com o formato esperado. Um valor que existe mas não tem a cara certa denuncia o campo trocado tão bem quanto o vazio denuncia o seletor quebrado.

```python
import re

# o gabarito também afirma a FORMA do valor, não só a presença
FORMATO = {
    "numero": re.compile(r"^\d{5,}$"),            # só dígitos, tamanho mínimo
    "data":   re.compile(r"^\d{2}/\d{2}/\d{4}$"), # padrão de data esperado
}
for r in res:
    for campo, padrao in FORMATO.items():
        valor = r.get(campo, "")
        assert padrao.match(valor), f"{campo} fora do formato: {valor!r} (campo trocado?)"
```

E nada substitui o olho humano de vez em quando: pegue uma amostra pequena do que você coletou e confira à mão contra a fonte. Cinco registros conferidos pegam o erro sistemático que nenhuma asserção previu, porque você só escreve asserção para o erro que já imaginou.

## Consertar de graça: o replay offline

Quando um seletor quebra, o ciclo ingênuo de conserto é caríssimo: cada tentativa significa rede, captcha e navegação completa só pra testar uma regex. A saída é separar o parser do resto e rodá-lo offline, contra um HTML que um run anterior já salvou. Sem rede, sem captcha, sem navegador, você itera o seletor em milissegundos e valida contra o gabarito com um PASS/FAIL. Isso exige uma única decisão de design lá atrás: que a função de parse receba o HTML como argumento e não busque nada por dentro.

```python
# parser PURO: recebe HTML, devolve dados. NÃO faz rede por dentro.
def parse_detalhe(html, doc):
    ...

# replay: roda só o parser contra um HTML salvo de um run anterior
html = open("captura/resposta_200.html").read()
dados = parse_detalhe(html, doc)
conferir_contra_gabarito(dados)   # PASS/FAIL sem ir à produção
```

Essa separação, um parser puro, sem efeitos colaterais, é a decisão que torna todo o resto barato: testável offline, diagnosticável, à prova de regressão.

## Resumo

O scraper falha calado quando o site muda, então o trabalho é tornar a quebra barulhenta: assinatura versionada para pegar "a estrutura mudou", gabarito de presença e forma para pegar "parou de extrair", e replay offline para consertar de graça.
